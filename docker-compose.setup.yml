services:
  certs:
    build: ./certs
    environment:
      - AUTHORITY_NAME=${AUTHORITY_NAME:-CA}
      - AUTHORITY_PASSWORD=${AUTHORITY_PASSWORD:-CHANGE_IT}
      - COMPANY=${COMPANY:-Company}
      - DOMAIN_NAME=${DOMAIN_NAME:-example.com}
      - CERT_EXTRA_SANS=${CERT_EXTRA_SANS:-}
      - COUNTRY_CODE=${COUNTRY_CODE:-CC}
      - STATE=${STATE:-State}
      - CITY=${CITY:-City}
    volumes:
      - ./secrets/certs:/certs:rw
    logging:  # rotated like every service (docker-compose.yml, x-logging)
      driver: json-file
      options:
        max-size: "${CVENGINE_LOG_MAX_SIZE:-50m}"
        max-file: "${CVENGINE_LOG_MAX_FILE:-5}"
