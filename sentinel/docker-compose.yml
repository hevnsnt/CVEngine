# One Sentinel. Run it with: docker compose -f sentinel/docker-compose.yml up -d
# See sentinel/README.md for the one-time provisioning blob and how to get one from the Sentinels page.
services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvengine/sentinel:latest
    container_name: cvengine-sentinel
    restart: unless-stopped
    environment:
      # One-time provisioning blob from the Sentinels page's Provision button (CVENGINE_SENTINEL_BLOB). Only needed
      # once: after a successful bootstrap the Sentinel's own token lives in the sentinel-state volume below and this
      # value is ignored on every later start.
      CVENGINE_SENTINEL_BLOB: "${CVENGINE_SENTINEL_BLOB:-}"
      # Optional: defaults to this container's hostname (a random id unless you set one below).
      CVENGINE_SENTINEL_NAME: "${CVENGINE_SENTINEL_NAME:-}"
      # Optional: how many nmap/naabu/nuclei runs this Sentinel executes at once. Default 1.
      CVENGINE_SENTINEL_MAX_CONCURRENT: "${CVENGINE_SENTINEL_MAX_CONCURRENT:-1}"
    # nmap's OS detection and naabu's SYN scanning need raw sockets; NET_RAW/NET_ADMIN are enough, no --privileged.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Uncomment to scan your LAN directly instead of only the Docker bridge network (most self-hosted setups want this):
    # network_mode: host
    volumes:
      - sentinel-state:/var/lib/cvengine-sentinel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Persists the Sentinel's own issued token across restarts, so the one-time enrollment blob is only ever needed once.
  sentinel-state:
