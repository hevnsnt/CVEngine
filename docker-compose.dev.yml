# Every container's log rotates: Docker's json-file driver keeps at most CVENGINE_LOG_MAX_FILE files of CVENGINE_LOG_MAX_SIZE each per container
# (default 5 x 50 MB), instead of one file that grows until the disk is full. The database writes its connection log here too (log_connections).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${CVENGINE_LOG_MAX_SIZE:-50m}"
    max-file: "${CVENGINE_LOG_MAX_FILE:-5}"

services:
  db:
    restart: always
    image: "postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71"
    # Every worker task holds a database connection while it runs (gevent greenlets, no pooling), and the discovery worker alone may run up to 32
    # at once: PostgreSQL's default of 100 connections is too few. An update recreates this container once when this line changes (scripts/update.sh).
    # The memory settings default to what this file always used (work_mem 4MB and no preloaded library are PostgreSQL's own defaults); a bigger host
    # raises them in .env (docs/DEPLOYMENT.md, Sizing the database). POSTGRES_SHARED_PRELOAD_LIBRARIES=pg_stat_statements turns on query statistics.
    # POSTGRES_TRACK_IO_TIMING (off) and POSTGRES_LOG_MIN_DURATION_STATEMENT (-1, no slow query log) are diagnostics, PostgreSQL's own defaults when unset.
    # Two diagnostics are on by default (POSTGRES_LOG_LOCK_WAITS, POSTGRES_TRACK_WAL_IO_TIMING; off turns either off): a statement that waits longer
    # than deadlock_timeout (1s) for a lock is logged with the process that holds it, and the time spent writing and flushing WAL is counted (pg_stat_io).
    # Commits do not wait for their WAL flush (synchronous_commit=off, POSTGRES_SYNCHRONOUS_COMMIT): on a disk that stalls, every commit used to
    # queue behind the flushes of the others. The trade: a crash of the server or the host can lose the last writes acknowledged in about 0.6 s
    # (three times wal_writer_delay, left at its 200 ms default), never corrupt anything. This application can accept that: progress, heartbeats
    # and task leases are re-derived or retried by the Sentinel, and scan results are written in their own transactions and a lost last write is
    # sent again. The writes that must survive a crash (audit rows, token revocations, address bans, validation budget) still commit durably
    # (usage_stamps.durable_commit). POSTGRES_SYNCHRONOUS_COMMIT=on in .env turns it back on (docs/CONFIGURATION.md); the update also removes an
    # ALTER SYSTEM value of it, so this line is the one source (scripts/update-deploy.sh).
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}",
              "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}", "-c", "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}",
              "-c", "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}", "-c", "work_mem=${POSTGRES_WORK_MEM:-4MB}",
              "-c", "shared_preload_libraries=${POSTGRES_SHARED_PRELOAD_LIBRARIES:-}", "-c", "track_io_timing=${POSTGRES_TRACK_IO_TIMING:-off}",
              "-c", "log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:--1}",
              "-c", "log_connections=${POSTGRES_LOG_CONNECTIONS:-on}", "-c", "log_disconnections=${POSTGRES_LOG_DISCONNECTIONS:-on}",
              "-c", "log_lock_waits=${POSTGRES_LOG_LOCK_WAITS:-on}", "-c", "track_wal_io_timing=${POSTGRES_TRACK_WAL_IO_TIMING:-on}",
              "-c", "synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-off}"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
    volumes:
      # PostgreSQL 18 images keep PGDATA in a version directory under /var/lib/postgresql, so mount there.
      # A new volume: the old PostgreSQL 12 data cannot be opened by 18 (see scripts/upgrade-postgres.sh).
      - postgres18_data:/var/lib/postgresql
    networks:
      - data_network  # web, celery and celery-beat only, as in docker-compose.yml
    ports:
      - "127.0.0.1:5432:5432"
    logging: *default-logging

  redis:
    image: "redis:alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483"
    hostname: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # With a password in .env (new installs get one; scripts/enable-redis-auth.sh adds it to an older install) the broker refuses anyone
    # on the Docker network who does not have it. Without one it is open, as it always was.
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi"]
    networks:
      - data_network
    logging: *default-logging

  # The one-off database owner service. It is the ONLY container that gets the owner role's password (POSTGRES_PASSWORD: the role the
  # database image created, a superuser on a stock install) and DJANGO_SUPERUSER_PASSWORD (from .env). It runs, then exits (web/migrate-entrypoint.sh): the
  # migrations, then `manage.py db_app_role gate`, which creates or updates the least privilege app role web, celery and celery-beat connect as,
  # grants it, and checks that it logs in. `docker compose up` runs it before them (their depends_on), and the update scripts and `make up` run
  # it before they start them. Other owner commands run here too: `docker compose run --rm migrate python3 manage.py createsuperuser` (make
  # username, make admin, make migrate, make test). When the app role cannot be used the gate exits 1 with the one-line fix and the application
  # is not started: it is never given the owner password by accident. CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 in .env is the explicit way to run it
  # on the owner role: the gate then writes the owner password to the db_owner_fallback volume, which web, celery and celery-beat mount
  # read-only, and removes it again once the app role works (docs/CONFIGURATION.md, Database roles). Not long running: restart "no".
  migrate:
    build:  # the same image as web (cvengine/web:latest), built with it
      context: ./web
    image: cvengine/web:latest
    entrypoint: /usr/src/app/migrate-entrypoint.sh
    # DEVELOPMENT ONLY: ./web is bind-mounted writable over the image's source (edit and reload), and those files belong to your account, not to the
    # image's (uid 10002), so these containers run as root here. Production (docker-compose.yml) runs the image's own source as uid 10002 with no
    # capabilities and mounts nothing of web/ over it (docs/DEPLOYMENT.md, "Who the containers run as").
    user: "0:0"
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=1
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_ROLE=owner
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}
      - CVENGINE_DB_OWNER_FALLBACK_FILE=/var/lib/cvengine-db-owner/password
    volumes:
      - ./web:/usr/src/app
      - db_owner_fallback:/var/lib/cvengine-db-owner
    depends_on:
      - db
      - redis
    networks:
      - data_network  # the database (and Redis, which Django's settings name), nothing else
    logging: *default-logging

  celery:
    mem_limit: "${CELERY_MEM_LIMIT:-4g}"  # container ceiling; heavy scanner jobs queue inside it (cvengine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see cvengine/ai_providers.py reachable_url)
    build:
      context: ./web
    restart: always
    init: true  # tini as PID 1; the entrypoint turns SIGTERM into a warm worker shutdown and exits when a worker dies (see docker-compose.yml)
    stop_grace_period: 60s
    entrypoint: /usr/src/app/celery-entrypoint.sh
    # DEVELOPMENT ONLY: ./web is bind-mounted writable over the image's source (edit and reload), and those files belong to your account, not to the
    # image's (uid 10002), so these containers run as root here. Production (docker-compose.yml) runs the image's own source as uid 10002 with no
    # capabilities and mounts nothing of web/ over it (docs/DEPLOYMENT.md, "Who the containers run as").
    user: "0:0"
    healthcheck:  # all four workers answer and consume their queue (web/celery_healthcheck.py; the entrypoint exits when one is gone)
      test: ["CMD", "python3", "celery_healthcheck.py"]
      interval: 60s
      timeout: 40s
      retries: 3
      start_period: 10m
    # command: watchmedo auto-restart --recursive --pattern="*.py" --directory="/usr/src/app/cvengine/" -- celery -A cvengine.tasks worker --autoscale=10,0 -l INFO
    volumes:
      - ./web:/usr/src/app
      - scan_results:/usr/src/scan_results
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/home/cvengine/.config  # HOME of the image (web/Dockerfile)
      - db_owner_fallback:/var/lib/cvengine-db-owner:ro  # empty unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (the migrate service writes it)
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=1
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-}
      # 1 restarts workers on every .py edit, killing any scan in flight; restart manually instead
      - CELERY_AUTORELOAD=0
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=  # empty on purpose: the owner password is only in the one-off migrate service (this also blanks the one .env would pass)
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}  # the least privilege role the server runs as (docs/CONFIGURATION.md, Database roles)
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}  # generated by the update and make up (scripts/db-app-role.sh)
      - DJANGO_SUPERUSER_PASSWORD=  # empty: only make admin needs it, and that runs in the migrate service
      - CVENGINE_DB_OWNER_FALLBACK_FILE=/var/lib/cvengine-db-owner/password  # absent unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (docs/CONFIGURATION.md)
    depends_on:
      migrate:  # the one-off owner service: migrations, the app role and its check; nothing starts when it fails
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - cvengine_network
      - data_network
    logging: *default-logging

  celery-beat:
    mem_limit: "${BEAT_MEM_LIMIT:-512m}"  # container ceiling; heavy scanner jobs queue inside it (cvengine/resources.py)
    restart: always
    build: ./web
    entrypoint: /usr/src/app/beat-entrypoint.sh
    # DEVELOPMENT ONLY: ./web is bind-mounted writable over the image's source (edit and reload), and those files belong to your account, not to the
    # image's (uid 10002), so these containers run as root here. Production (docker-compose.yml) runs the image's own source as uid 10002 with no
    # capabilities and mounts nothing of web/ over it (docs/DEPLOYMENT.md, "Who the containers run as").
    user: "0:0"
    command: celery -A cvengine beat -l INFO --scheduler cveFeed.scan_control:PauseAwareScheduler
    depends_on:
      migrate:  # the one-off owner service: migrations, the app role and its check; nothing starts when it fails
        condition: service_completed_successfully
      celery:
        condition: service_started
      db:
        condition: service_started
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=1
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=  # empty on purpose: the owner password is only in the one-off migrate service (this also blanks the one .env would pass)
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}  # the least privilege role the server runs as (docs/CONFIGURATION.md, Database roles)
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}  # generated by the update and make up (scripts/db-app-role.sh)
      - DJANGO_SUPERUSER_PASSWORD=  # empty: only make admin needs it, and that runs in the migrate service
      - CVENGINE_DB_OWNER_FALLBACK_FILE=/var/lib/cvengine-db-owner/password  # absent unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (docs/CONFIGURATION.md)
    volumes:
      - ./web:/usr/src/app
      - scan_results:/usr/src/scan_results
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/home/cvengine/.config  # HOME of the image (web/Dockerfile)
      - db_owner_fallback:/var/lib/cvengine-db-owner:ro  # empty unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (the migrate service writes it)
    networks:
      - cvengine_network
      - data_network
    logging: *default-logging

  web:
    mem_limit: "${WEB_MEM_LIMIT:-1g}"  # container ceiling; heavy scanner jobs queue inside it (cvengine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see cvengine/ai_providers.py reachable_url)
    build:
      context: ./web
    entrypoint: /usr/src/app/entrypoint.sh
    # DEVELOPMENT ONLY: ./web is bind-mounted writable over the image's source (edit and reload), and those files belong to your account, not to the
    # image's (uid 10002), so these containers run as root here. Production (docker-compose.yml) runs the image's own source as uid 10002 with no
    # capabilities and mounts nothing of web/ over it (docs/DEPLOYMENT.md, "Who the containers run as").
    user: "0:0"
    restart: always
    image: cvengine/web:latest
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=1
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-}
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=  # empty on purpose: the owner password is only in the one-off migrate service (this also blanks the one .env would pass)
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}  # the least privilege role the server runs as (docs/CONFIGURATION.md, Database roles)
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}  # generated by the update and make up (scripts/db-app-role.sh)
      - DJANGO_SUPERUSER_PASSWORD=  # empty: only make admin needs it, and that runs in the migrate service
      - CVENGINE_DB_OWNER_FALLBACK_FILE=/var/lib/cvengine-db-owner/password  # absent unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (docs/CONFIGURATION.md)
    volumes:
      - ./web:/usr/src/app
      - scan_results:/usr/src/scan_results
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/home/cvengine/.config  # HOME of the image (web/Dockerfile)
      - db_owner_fallback:/var/lib/cvengine-db-owner:ro  # empty unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (the migrate service writes it)
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:  # the one-off owner service: migrations, the app role and its check; nothing starts when it fails
        condition: service_completed_successfully
      db:
        condition: service_started
      celery:
        condition: service_started
      celery-beat:
        condition: service_started
    networks:
      - cvengine_network
      - data_network
    logging: *default-logging

networks:
  cvengine_network:
  data_network:  # the database and Redis, with web, celery and celery-beat only
volumes:
  tool_config:
  db_owner_fallback:
  postgres18_data:
  generated_templates:
  scan_results:
