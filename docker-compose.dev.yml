# Every container's log rotates: Docker's json-file driver keeps at most CVENGINE_LOG_MAX_FILE files of CVENGINE_LOG_MAX_SIZE each per container
# (default 5 x 50 MB), instead of one file that grows until the disk is full. The database writes its connection log here too (log_connections).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${CVENGINE_LOG_MAX_SIZE:-50m}"
    max-file: "${CVENGINE_LOG_MAX_FILE:-5}"

services:
  db:
    restart: always
    image: "postgres:18-alpine"
    # Every worker task holds a database connection while it runs (gevent greenlets, no pooling), and the discovery worker alone may run up to 32
    # at once: PostgreSQL's default of 100 connections is too few. An update recreates this container once when this line changes (scripts/update.sh).
    # The memory settings default to what this file always used (work_mem 4MB and no preloaded library are PostgreSQL's own defaults); a bigger host
    # raises them in .env (docs/DEPLOYMENT.md, Sizing the database). POSTGRES_SHARED_PRELOAD_LIBRARIES=pg_stat_statements turns on query statistics.
    # POSTGRES_TRACK_IO_TIMING (off) and POSTGRES_LOG_MIN_DURATION_STATEMENT (-1, no slow query log) are diagnostics, PostgreSQL's own defaults when unset.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}",
              "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}", "-c", "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}",
              "-c", "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}", "-c", "work_mem=${POSTGRES_WORK_MEM:-4MB}",
              "-c", "shared_preload_libraries=${POSTGRES_SHARED_PRELOAD_LIBRARIES:-}", "-c", "track_io_timing=${POSTGRES_TRACK_IO_TIMING:-off}",
              "-c", "log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:--1}",
              "-c", "log_connections=${POSTGRES_LOG_CONNECTIONS:-on}", "-c", "log_disconnections=${POSTGRES_LOG_DISCONNECTIONS:-on}"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
    volumes:
      # PostgreSQL 18 images keep PGDATA in a version directory under /var/lib/postgresql, so mount there.
      # A new volume: the old PostgreSQL 12 data cannot be opened by 18 (see scripts/upgrade-postgres.sh).
      - postgres18_data:/var/lib/postgresql
    networks:
      - data_network  # web, celery and celery-beat only, as in docker-compose.yml
    ports:
      - "127.0.0.1:5432:5432"
    logging: *default-logging

  redis:
    image: "redis:alpine"
    hostname: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # With a password in .env (new installs get one; scripts/enable-redis-auth.sh adds it to an older install) the broker refuses anyone
    # on the Docker network who does not have it. Without one it is open, as it always was.
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi"]
    networks:
      - data_network
    logging: *default-logging

  celery:
    mem_limit: "${CELERY_MEM_LIMIT:-4g}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see reNgine/ai_providers.py reachable_url)
    build:
      context: ./web
    restart: always
    init: true  # tini as PID 1; the entrypoint turns SIGTERM into a warm worker shutdown and exits when a worker dies (see docker-compose.yml)
    stop_grace_period: 60s
    entrypoint: /usr/src/app/celery-entrypoint.sh
    healthcheck:  # all four workers answer and consume their queue (web/celery_healthcheck.py; the entrypoint exits when one is gone)
      test: ["CMD", "python3", "celery_healthcheck.py"]
      interval: 60s
      timeout: 40s
      retries: 3
      start_period: 10m
    # command: watchmedo auto-restart --recursive --pattern="*.py" --directory="/usr/src/app/reNgine/" -- celery -A reNgine.tasks worker --autoscale=10,0 -l INFO
    volumes:
      - ./web:/usr/src/app
      - scan_results:/usr/src/scan_results
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=1
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-}
      # 1 restarts workers on every .py edit, killing any scan in flight; restart manually instead
      - CELERY_AUTORELOAD=0
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}  # the least privilege role the server runs as; empty = the owner role (docs/CONFIGURATION.md, Database roles)
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}  # generated by the update and make up (scripts/db-app-role.sh); empty = the owner role
    depends_on:
      - db
      - redis
    networks:
      - rengine_network
      - data_network
    logging: *default-logging

  celery-beat:
    mem_limit: "${BEAT_MEM_LIMIT:-512m}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    restart: always
    build: ./web
    entrypoint: /usr/src/app/beat-entrypoint.sh
    command: celery -A reNgine beat -l INFO --scheduler cveFeed.scan_control:PauseAwareScheduler
    depends_on:
      - celery
      - db
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=1
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}  # the least privilege role the server runs as; empty = the owner role (docs/CONFIGURATION.md, Database roles)
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}  # generated by the update and make up (scripts/db-app-role.sh); empty = the owner role
    volumes:
      - ./web:/usr/src/app
      - scan_results:/usr/src/scan_results
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
    networks:
      - rengine_network
      - data_network
    logging: *default-logging

  web:
    mem_limit: "${WEB_MEM_LIMIT:-1g}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see reNgine/ai_providers.py reachable_url)
    build:
      context: ./web
    entrypoint: /usr/src/app/entrypoint.sh
    restart: always
    image: cvengine/web:latest
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=1
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-}
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}  # the least privilege role the server runs as; empty = the owner role (docs/CONFIGURATION.md, Database roles)
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}  # generated by the update and make up (scripts/db-app-role.sh); empty = the owner role
    volumes:
      - ./web:/usr/src/app
      - scan_results:/usr/src/scan_results
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - celery
      - celery-beat
    networks:
      - rengine_network
      - data_network
    logging: *default-logging

networks:
  rengine_network:
  data_network:  # the database and Redis, with web, celery and celery-beat only
volumes:
  tool_config:
  postgres18_data:
  generated_templates:
  scan_results:
