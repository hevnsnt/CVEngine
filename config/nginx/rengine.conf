# Cache policy for /staticfiles/. The application puts a hash of each file's content in every stylesheet and script URL it writes (?v=<10 hex>,
# cveFeed/templatetags/assets.py, including the import map the ES modules use), so a versioned URL names exactly one file for ever: browsers and a
# CDN may keep it for a year and never ask again. An unversioned URL (the fonts, which the stylesheet names; anything typed by hand) can change
# under the same name, so it is revalidated on every use. Only a well-formed hash earns the long life: ?v=1 or ?v=anything else stays no-cache.
map $arg_v $cvengine_static_cache {
    default                         "no-cache";
    "~^[0-9a-f]{8,64}$"             "public, max-age=31536000, immutable";
}

# Client addresses. By default this proxy is the first hop: whatever X-Forwarded-For a client sends is thrown away and replaced by the address the
# client connected from, so the application can never be handed a forged chain. Behind a tunnel or CDN that is the wrong address (every client would
# be the connector), so a request is believed only when BOTH hold: it arrived on the tunnel listener (port 8443 below, which a Compose overlay publishes
# on 127.0.0.1 and nothing else does) AND its peer is listed in /etc/nginx/trusted-upstreams.conf (one "<address> 1;" per line; the stock file is empty,
# and docs/HOSTING-ONLINE.md, "Through a Cloudflare Tunnel", shows how to mount your own). Then its X-Forwarded-For is kept and this proxy appends the
# peer, which is what the application expects (reNgine/client_ip.py takes the right-most address that is not a trusted proxy, so anything a client wrote
# on the left is never picked). Port 443 never believes a chain, whatever the file says: Docker's userland proxy can show an outside client to nginx
# as the bridge gateway, so the peer alone is not proof of who is connecting.
geo $cvengine_upstream_trusted {
    default                         0;
    include                         /etc/nginx/trusted-upstreams.conf;
}
map "$server_port:$cvengine_upstream_trusted:$http_x_forwarded_for" $cvengine_forwarded_for {
    default                         $remote_addr;
    "~^8443:1:.+"                   "$http_x_forwarded_for, $remote_addr";
}

server {
    listen                                          8082 default;
    listen                                          [::]:8082 default;
    server_name                                     rengine recon;
    return                                          301 https://$host$request_uri;
}


server {
    listen                                          443 ssl http2;
    listen                                          [::]:443 ssl http2;
    listen                                          8443 ssl http2;  # the tunnel listener (see "Client addresses" above): not published unless an overlay does it
    server_name                                     rengine recon;

    charset                                         utf-8;
    keepalive_timeout                               70;

    # Docker's own DNS, asked again every 10 s: with a name in a variable (proxy_pass $cvengine_web below) nginx resolves "rengine" per request, so the proxy
    # needs no restart when the web container gets a new address, and it starts even while the web container is not up yet (it answers 502, which is the
    # maintenance page, until it is). 127.0.0.11 is where Docker serves names on a user-defined network, which compose always creates.
    resolver                                        127.0.0.11 valid=10s ipv6=off;
    resolver_timeout                                5s;

    # nothing uploads files except the one seed import below; the largest other request is a pasted target list (up to 2 MB of text)
    client_max_body_size                            4M;
    client_header_timeout                           20s;
    client_body_timeout                             30s;
    send_timeout                                    60s;

    # The live screen polls JSON every few seconds (stats, graph, activity, sentinels): compress it, and the scripts and styles it loads, so a poll
    # is a fraction of its size on the wire. text/html is deliberately NOT compressed (BREACH: pages carry the CSRF token), and images, archives and
    # anything already compressed are left alone; a response the application compressed itself (Content-Encoding set) is never compressed again.
    gzip                                            on;
    gzip_types                                      application/json application/javascript text/javascript text/css image/svg+xml;
    gzip_min_length                                 1024;
    gzip_comp_level                                 5;
    gzip_vary                                       on;
    gzip_proxied                                    any;  # behind a CDN every request carries a Via header; nginx would otherwise skip them

    # While an update migrates and restarts (scripts/update-deploy.sh creates the flag, and removes it when the site answers again), and
    # whenever the application does not answer at all, visitors get a friendly page instead of an error. It is one self-contained file: it
    # needs no stylesheet or script from the application, which is the thing that is down.
    proxy_intercept_errors                          on;
    error_page                                      502 503 504 /maintenance.html;
    location = /maintenance.html {
        internal;
        root                                        /usr/share/nginx/maintenance;
        # "updating" while config/nginx/state/maintenance exists; "failed" when scripts/apply-update.sh also left maintenance-failed (the update did not
        # finish and the administrator has to fix it). The page reads it from <html data-maint>, so the text is right on the first paint.
        set $maint_state updating;
        if (-f /etc/nginx/state/maintenance-failed) { set $maint_state failed; }
        sub_filter                                  '__MAINT_STATE__' '$maint_state';
        sub_filter_once                             on;
        add_header X-CVE-Maintenance "$maint_state" always;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The live status of a running update, written by the updater (scripts/update-status.py) next to the maintenance flag. Public while it exists, so it
    # holds only whitelisted text. No file: 404, and the page shows its plain message.
    location = /maintenance-status.json {
        alias                                       /etc/nginx/state/status.json;
        default_type                                application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        if (-f /etc/nginx/state/maintenance) { return 503; }
        proxy_read_timeout                          300;
        proxy_connect_timeout                       300;
        proxy_redirect                              off;

        proxy_set_header                            Host $http_host;  # keeps a non-default port, which Django's Origin check compares
        proxy_set_header                            X-Real-IP $remote_addr;
        proxy_set_header                            X-Forwarded-For $cvengine_forwarded_for;  # overwritten with the peer unless the peer is a trusted upstream (above)
        proxy_set_header                            X-Forwarded-Proto $scheme;
        # The address goes through a variable, and the resolver below looks the name up again every 10 s, so when the web container is recreated alone (a
        # new address) this proxy follows it without a restart. A fixed "proxy_pass http://rengine:8000" is looked up once, when nginx starts. The rewrite
        # keeps what the old "http://rengine:8000/" did: the upstream gets the cleaned-up path (percent-codes and double slashes resolved, then escaped
        # again), not the raw one that the two routes below send.
        set                                         $cvengine_web http://rengine:8000;
        rewrite                                     ^ $uri break;
        proxy_pass                                  $cvengine_web;
    }

    # A Sentinel reports a finished task in one body (an OpenVAS result set or a nuclei run can be several MB), and a streamed task (bbot discovery)
    # its partial batches (up to four 2 MiB screenshots each). Only those routes may be larger; the application caps and cleans every field of them
    # (agentapi.sentinel_broker, agentapi.sentinel_stream), and they need a Sentinel token.
    location ~ ^/api/v1/sentinel/tasks/[0-9]+/(result|partial)$ {
        if (-f /etc/nginx/state/maintenance) { return 503; }
        client_max_body_size                        24M;
        client_body_timeout                         120s;
        proxy_read_timeout                          300;
        proxy_connect_timeout                       300;
        proxy_redirect                              off;
        proxy_request_buffering                     on;

        proxy_set_header                            Host $http_host;
        proxy_set_header                            X-Real-IP $remote_addr;
        proxy_set_header                            X-Forwarded-For $cvengine_forwarded_for;
        proxy_set_header                            X-Forwarded-Proto $scheme;
        set                                         $cvengine_web http://rengine:8000;  # a variable so the resolver re-resolves it (see location /)
        proxy_pass                                  $cvengine_web;
    }

    # Settings > CVE catalog seed > Import a seed file: one upload of the catalog (about 14 MB today). Only this route may be larger; the application
    # caps it again (256 MB), needs an App Admin session with the CSRF token, and checks the file before and while importing it.
    location = /cve/api/settings/cve_seed/import {
        if (-f /etc/nginx/state/maintenance) { return 503; }
        client_max_body_size                        260M;
        client_body_timeout                         120s;
        proxy_read_timeout                          300;
        proxy_connect_timeout                       300;
        proxy_redirect                              off;
        proxy_request_buffering                     on;

        proxy_set_header                            Host $http_host;
        proxy_set_header                            X-Real-IP $remote_addr;
        proxy_set_header                            X-Forwarded-For $cvengine_forwarded_for;
        proxy_set_header                            X-Forwarded-Proto $scheme;
        set                                         $cvengine_web http://rengine:8000;  # a variable so the resolver re-resolves it (see location /)
        proxy_pass                                  $cvengine_web;
    }

    location /staticfiles/ {
        alias /usr/src/app/staticfiles/;
        # one release can never be served with another's files: a changed file gets a new ?v= hash (and so a new URL), and an unversioned URL is
        # revalidated on every use (see the map at the top of this file). A CDN follows the same header, so nothing needs purging after an update.
        # deliberately without the "always" flag: nginx then adds this header only to a 200, 204, 206, 301, 302 or 304, so the year-long value is never
        # put on a 404 (a CDN or browser would keep it) or on an error page
        add_header Cache-Control $cvengine_static_cache;
        add_header X-Content-Type-Options "nosniff" always;  # add_header in a location replaces the server's, so it is repeated
    }

    location /protected_media/ {
        internal;
        alias /usr/src/scan_results/;
        autoindex off;
        # scan results hold text a scanned host wrote (HTML, SVG): never let a browser run it as a page on this origin
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store" always;
    }

    ssl_protocols                                   TLSv1.2 TLSv1.3;

    ssl_certificate                                 /etc/nginx/certs/rengine.pem;                 # RSA certificate in PEM format.
    ssl_certificate_key                             /etc/nginx/certs/rengine_rsa.key;             # Secret key in PEM format.
    ssl_trusted_certificate                         /etc/nginx/certs/rengine_chain.pem;           # Certificate chain.

    ssl_ciphers                                     '!EDH:!EXP:!SHA:!DSS:EECDH+aRSA+AESGCM:EECDH+aRSA+SHA384:EECDH+aRSA+SHA256';  # Cipher suite (see https://tls.imirhil.fr/suite/ and `openssl ciphers | sed -r -e 's/:/\n/g'`).
    ssl_prefer_server_ciphers                       on;                                                 # Specifies that server ciphers should be preferred over client ciphers.

    # ssl_dhparam                                     /etc/ssl/private/private/dh4096.pem;                # Diffie-Hellman server params with 4096 bits (generated using `openssl dhparam 4096 -out /etc/ssl/private/private/dh4096.pem`).
    ssl_ecdh_curve                                  secp384r1:X25519:prime256v1;                        # Elliptic Curve Diffie-Hellman server params.

    ssl_session_cache                               shared:SSL:10m;                                     # Create a shared cache able to store about 80000 sessions (about 4000 for 1MB storage).
    ssl_session_timeout                             5m;                                                 # Timeout before session to be dropped.
    ssl_session_tickets                             off;                                                # Disable TLS session tickets.
}
