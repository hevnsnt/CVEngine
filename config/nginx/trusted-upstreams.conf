# Peers whose X-Forwarded-For the bundled proxy believes, but only on its tunnel listener, port 8443 (see the "Client addresses" block at the top of
# rengine.conf). Empty: nobody is, which is right for an install that clients connect to directly. One "<address> 1;" per line: the one address your
# tunnel connector connects from, nothing wider. docs/HOSTING-ONLINE.md, "Through a Cloudflare Tunnel", says how to find it.
# Do not edit this file (an update would stop on the change): copy it to config/nginx/trusted-upstreams.local.conf, edit the copy, and mount that over
# this one in your own Compose overlay.
