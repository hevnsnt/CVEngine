# Peers whose X-Forwarded-For the bundled proxy believes (see the "Client addresses" block at the top of rengine.conf). Empty: nobody is, which is right
# for an install that clients connect to directly. One "<address or CIDR> 1;" per line, for example "172.16.0.0/12 1;".
# Do not edit this file (an update would stop on the change): copy it to config/nginx/trusted-upstreams.local.conf, edit the copy, and mount that over
# this one in your own Compose overlay. docs/HOSTING-ONLINE.md, "Through a Cloudflare Tunnel", has the lines.
