# cvENGINE: hand the real client address to the bundled proxy (docs/DEPLOYMENT.md, "Client addresses behind a host proxy").
#
# For a host nginx that terminates TLS for cvENGINE and forwards to the bundled proxy's 443 listener (for example proxy_pass https://127.0.0.1:18443).
# Put these lines in the location (or snippet) that holds that proxy_pass, then `sudo nginx -t && sudo systemctl reload nginx`.
# `scripts/client-address-check.sh --snippet` prints this file with this install's secret filled in; never commit the filled copy.
#
# Behind Cloudflare, first make $remote_addr the visitor (once, in the http or server block):
#     real_ip_header CF-Connecting-IP;
#     set_real_ip_from <every range in https://www.cloudflare.com/ips-v4 and ips-v6>;
# Without that, $remote_addr is the Cloudflare edge and every visitor shares a handful of addresses.

# Replace any chain a client sent with the one address this nginx saw (never $proxy_add_x_forwarded_for: a client could write the left part).
proxy_set_header X-Forwarded-For $remote_addr;
# The install's upstream secret (CVENGINE_UPSTREAM_SECRET in cvENGINE's .env). The bundled proxy believes X-Forwarded-For on 443 only with it,
# and removes it before the request reaches the application. Anyone who holds it can choose the address cvENGINE records: keep this file
# readable by root only (chmod 600).
proxy_set_header X-CVEngine-Upstream "@CVENGINE_UPSTREAM_SECRET@";
