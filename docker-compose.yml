services:
  db:
    restart: always
    image: "postgres:18-alpine"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA in a version directory under /var/lib/postgresql, so mount there.
      # A new volume: the old PostgreSQL 12 data cannot be opened by 18 (see scripts/upgrade-postgres.sh).
      - postgres18_data:/var/lib/postgresql
    networks:
      - rengine_network

  redis:
    restart: always
    image: "redis:alpine"
    hostname: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # With a password in .env (new installs get one; scripts/enable-redis-auth.sh adds it to an older install) the broker refuses anyone
    # on the Docker network who does not have it. Without one it is open, as it always was.
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi"]
    networks:
      - rengine_network

  celery:
    mem_limit: "${CELERY_MEM_LIMIT:-4g}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see reNgine/ai_providers.py reachable_url)
    build:
      context: ./web
    restart: always
    entrypoint: /usr/src/app/celery-entrypoint.sh
    volumes:
      - ./web:/usr/src/app
      - github_repos:/usr/src/github
      - scan_results:/usr/src/scan_results
      - nuclei_templates:/root/nuclei-templates
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
      - static_volume:/usr/src/app/staticfiles/
      - tailscale_status:/var/run/tailscale-status:ro  # the optional tailscale profile's published node status, read-only (docs/TAILSCALE.md); empty without it
      - openvas_gvmd_socket_vol:/run/gvmd:ro  # the optional openvas profile's gvmd (GMP) socket (docs/OPENVAS.md); an empty directory without it, and only celery mounts it
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-172.16.0.0/12}
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-3}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
    depends_on:
      - db
      - redis
    networks:
      - rengine_network

  celery-beat:
    mem_limit: "${BEAT_MEM_LIMIT:-512m}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    restart: always
    build: ./web
    entrypoint: /usr/src/app/beat-entrypoint.sh
    command: celery -A reNgine beat -l INFO --scheduler cveFeed.scan_control:PauseAwareScheduler
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-3}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
    depends_on:
      - celery
      - db
    volumes:
      - ./web:/usr/src/app
      - github_repos:/usr/src/github
      - scan_results:/usr/src/scan_results
      - nuclei_templates:/root/nuclei-templates
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
    networks:
      - rengine_network

  web:
    mem_limit: "${WEB_MEM_LIMIT:-1g}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see reNgine/ai_providers.py reachable_url)
    build:
      context: ./web
    entrypoint: /usr/src/app/entrypoint.sh
    # GUNICORN_WORKERS is pinned below (not read from .env): the lockout counters are in the shared Redis cache, so two workers is safe,
    # and a stray value in .env cannot change it
    restart: always
    image: cvengine/web:latest
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-172.16.0.0/12}
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-3}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - GUNICORN_WORKERS=2
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
    volumes:
      - ./web:/usr/src/app
      - github_repos:/usr/src/github
      - scan_results:/usr/src/scan_results
      - nuclei_templates:/root/nuclei-templates
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
      - static_volume:/usr/src/app/staticfiles/
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - celery
      - celery-beat
    networks:
      rengine_network:
        aliases:
          - rengine

  proxy:
    restart: always
    image: nginx:alpine
    # A stock image is only as new as the day it was first pulled: pull on every up, so an update brings nginx's security releases
    # whichever version of the update script is running (the one that applies an update is the one already on the host).
    pull_policy: always
    ports:
      - 8082:8082/tcp
      - 443:443/tcp
    depends_on:
      - web
      - db
      - redis
    secrets:
      - source: proxy.ca
        target: /etc/nginx/certs/rengine_chain.pem
      - source: proxy.cert
        target: /etc/nginx/certs/rengine.pem
      - source: proxy.key
        target: /etc/nginx/certs/rengine_rsa.key
    volumes:
      - ./config/nginx/rengine.conf:/etc/nginx/conf.d/rengine.conf:ro
      - ./config/nginx/maintenance.html:/usr/share/nginx/maintenance/maintenance.html:ro
      - ./config/nginx/state:/etc/nginx/state:ro  # holds the maintenance flag while an update runs
      - static_volume:/usr/src/app/staticfiles/
      - scan_results:/usr/src/scan_results:ro
    networks:
      - rengine_network

  # Optional: attach this install to a Tailscale tailnet so Settings > Tailscale can scan its devices. Off unless COMPOSE_PROFILES=tailscale is
  # in .env (or `docker compose --profile tailscale up -d`); the rest of the stack is the same either way. docs/TAILSCALE.md has the steps.
  # It joins the celery container's network namespace (network_mode), which is where every scan runs: tailscaled puts the tailscale0
  # interface and the 100.64.0.0/10 route there, so scans reach the tailnet with no routing changes and no extra privileges for celery.
  # tailscaled's own control socket stays inside this container (root on it can reconfigure the node, and every container runs as root).
  # What celery reads is a status.json this container rewrites every 15 seconds, in a volume celery mounts read-only; a stale file means
  # the node is down. --shields-up refuses connections INTO the scanner's namespace from other devices. The auth key is read from
  # .env.tailscale, not .env, so it is not handed to every other container; without it (and without a saved node state) the service stops
  # with a message instead of printing a login URL.
  tailscale:
    profiles: ["tailscale"]
    # Pinned on purpose: this container sits inside the scanner's namespace. To update, change the tag (releases and the security
    # bulletins are at https://tailscale.com/security-bulletins) or set TAILSCALE_IMAGE in .env, then `docker compose up -d tailscale`.
    image: "${TAILSCALE_IMAGE:-tailscale/tailscale:v1.104.2}"
    restart: always
    network_mode: "service:celery"
    depends_on:
      - celery
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - path: .env.tailscale
        required: false
    environment:
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_HOSTNAME=${TAILSCALE_HOSTNAME:-cvengine}
      - TS_ACCEPT_DNS=false  # scans use addresses; MagicDNS names are shown from the device list
      - TS_AUTH_ONCE=true  # the key is only needed to enrol; the node's own state keeps it signed in afterwards
      - TS_EXTRA_ARGS=--shields-up ${TAILSCALE_EXTRA_ARGS:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$TS_AUTHKEY" ] && [ ! -s "$$TS_STATE_DIR/tailscaled.state" ]; then
          echo "tailscale: no TS_AUTHKEY and no saved node state. Put TS_AUTHKEY=... in .env.tailscale (see docs/TAILSCALE.md); not starting, so no login URL is printed." >&2
          sleep 30
          exit 1
        fi
        (while true; do
          if tailscale --socket="$$TS_SOCKET" status --json > /status/status.tmp 2>/dev/null; then
            sed 's/"AuthURL": *"[^"]*"/"AuthURL": ""/' /status/status.tmp > /status/status.new && mv /status/status.new /status/status.json
          else
            rm -f /status/status.json
          fi
          sleep 15
        done) &
        exec /usr/local/bin/containerboot
    volumes:
      - tailscale_state:/var/lib/tailscale
      - tailscale_status:/status

  # Optional: OpenVAS (Greenbone Community Edition) as a vulnerability scanner. Off unless COMPOSE_PROFILES=openvas is in .env (or
  # `docker compose --profile openvas up -d`, `make openvas-up`); without it none of these services exist, start or use memory. docs/OPENVAS.md has
  # the hardware floor, the steps and what is not verified. This is the minimal set that exposes gvmd's GMP socket, taken from Greenbone's own
  # compose file for the community containers (greenbone.github.io/docs, "Greenbone Community Containers"): without the web interface (gsa, gsad,
  # nginx), the certificate generator and the gvm-tools shell. Only the celery container mounts gvmd's socket (read-only, see celery above); cvENGINE
  # talks GMP to it with python-gvm (cveFeed/openvas_scan.py). The scanner containers are on a network of their own, not rengine_network, and publish
  # no ports. Greenbone publishes no version tags, only the moving tags stable and community, so the program images are pinned by tag AND digest (to
  # update, pick the new digests as docs/OPENVAS.md describes), while the feed data images (the vulnerability tests, scap, cert and gvmd data) follow
  # their moving tag on purpose: they are data, refreshed daily and checked against Greenbone's GPG signing keys, and a pinned feed would be a stale one.
  # The first start downloads the feeds, which takes a long time and several GB of disk: no scan is possible until it ends (Settings > OpenVAS says so).
  openvas-vulnerability-tests:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/vulnerability-tests:community"
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - openvas_vt_data_vol:/mnt
    networks:
      - openvas_network

  openvas-notus-data:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/notus-data:community"
    environment:
      KEEP_ALIVE: 1
    volumes:
      - openvas_notus_data_vol:/mnt
    networks:
      - openvas_network

  openvas-scap-data:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/scap-data:community"
    environment:
      KEEP_ALIVE: 1
    volumes:
      - openvas_scap_data_vol:/mnt
    networks:
      - openvas_network

  openvas-cert-bund-data:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/cert-bund-data:community"
    environment:
      KEEP_ALIVE: 1
    volumes:
      - openvas_cert_data_vol:/mnt
    networks:
      - openvas_network

  openvas-dfn-cert-data:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/dfn-cert-data:community"
    environment:
      KEEP_ALIVE: 1
    volumes:
      - openvas_cert_data_vol:/mnt
    depends_on:
      openvas-cert-bund-data:
        condition: service_healthy
    networks:
      - openvas_network

  openvas-data-objects:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/data-objects:community"
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - openvas_data_objects_vol:/mnt
    networks:
      - openvas_network

  openvas-report-formats:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/report-formats:community"
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - openvas_data_objects_vol:/mnt
    depends_on:
      openvas-data-objects:
        condition: service_healthy
    networks:
      - openvas_network

  openvas-gpg-data:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/gpg-data:stable@sha256:c18618252f7d874cd1fe09413b043cfc40b57e6464d8c5973d4a93b074d5d91a"
    volumes:
      - openvas_gpg_data_vol:/mnt
    networks:
      - openvas_network

  openvas-redis:
    profiles: ["openvas"]
    restart: always
    image: "registry.community.greenbone.net/community/redis-server:stable@sha256:83227e34b276bf7c7453a91bbfc070341af58f7ff40eb707ed6724965fe3846c"
    volumes:
      - openvas_redis_socket_vol:/run/redis/
    networks:
      - openvas_network

  openvas-pg-gvm-migrator:
    profiles: ["openvas"]
    restart: "no"
    image: "registry.community.greenbone.net/community/pg-gvm-migrator:stable@sha256:8fc1cc11cac0481674527e01ec7610a8195110cf117d700bd47fe3af7012b34d"
    volumes:
      - openvas_psql_data_vol:/var/lib/postgresql
      - openvas_psql_socket_vol:/var/run/postgresql
    networks:
      - openvas_network

  openvas-pg-gvm:
    profiles: ["openvas"]
    restart: always
    image: "registry.community.greenbone.net/community/pg-gvm:stable@sha256:a18d9e2f0cbba7839e65547a2331ce8f984500e8c4fbe91d08f9a48036d03fa2"
    volumes:
      - openvas_psql_data_vol:/var/lib/postgresql
      - openvas_psql_socket_vol:/var/run/postgresql
    depends_on:
      openvas-pg-gvm-migrator:
        condition: service_completed_successfully
    networks:
      - openvas_network

  openvas-gvmd:
    profiles: ["openvas"]
    restart: always
    image: "registry.community.greenbone.net/community/gvmd:stable@sha256:e59a6a684b112ea77fe4ddd7e5ca35e6a07d36bf854f1b411d11d12f9b0c608a"
    volumes:
      - openvas_gvmd_data_vol:/var/lib/gvm
      - openvas_scap_data_vol:/var/lib/gvm/scap-data/
      - openvas_cert_data_vol:/var/lib/gvm/cert-data
      - openvas_data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - openvas_vt_data_vol:/var/lib/openvas/plugins
      - openvas_psql_data_vol:/var/lib/postgresql
      - openvas_gvmd_socket_vol:/run/gvmd
      - openvas_ospd_socket_vol:/run/ospd
      - openvas_psql_socket_vol:/var/run/postgresql
    depends_on:
      openvas-pg-gvm:
        condition: service_started
      openvas-scap-data:
        condition: service_healthy
      openvas-cert-bund-data:
        condition: service_healthy
      openvas-dfn-cert-data:
        condition: service_healthy
      openvas-data-objects:
        condition: service_healthy
      openvas-report-formats:
        condition: service_healthy
    networks:
      - openvas_network

  # writes the scanner's configuration (notus, and where openvasd listens) into a volume, then exits
  openvas-configure:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/openvas-scanner:stable@sha256:5067aa68bdb63038180cbdbb5cdc199c1908ec6b7d55997a41b6a51b14c12eee"
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log
    networks:
      - openvas_network

  # notus, the static vulnerability engine for authenticated package checks (OPENVASD_MODE service_notus: nothing else), reachable only by name inside the add-on's network
  openvas-openvasd:
    profiles: ["openvas"]
    restart: always
    image: "registry.community.greenbone.net/community/openvas-scanner:stable@sha256:5067aa68bdb63038180cbdbb5cdc199c1908ec6b7d55997a41b6a51b14c12eee"
    environment:
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - openvas_gpg_data_vol:/etc/openvas/gnupg
      - openvas_notus_data_vol:/var/lib/notus
    depends_on:
      openvas-vulnerability-tests:
        condition: service_healthy
      openvas-notus-data:
        condition: service_healthy
      openvas-configure:
        condition: service_completed_successfully
      openvas-gpg-data:
        condition: service_completed_successfully
    networks:
      openvas_network:
        aliases:
          - openvasd

  # the scanner itself. It needs raw sockets (NET_RAW, NET_ADMIN) and the unconfined seccomp and AppArmor profiles Greenbone's compose file uses, which is why
  # it is on its own network and why its scans leave by the Docker host's default route, never through the celery container (so no tailnet addresses: see docs/OPENVAS.md)
  openvas-ospd:
    profiles: ["openvas"]
    restart: always
    image: "registry.community.greenbone.net/community/ospd-openvas:stable@sha256:31a85272abc77521c98451ce6834ed7d2f887e98ff1b26ff3fd94f00d000b169"
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command: ["ospd-openvas", "-f", "--config", "/etc/gvm/ospd-openvas.conf", "--notus-feed-dir", "/var/lib/notus/advisories", "-m", "666"]
    volumes:
      - openvas_gpg_data_vol:/etc/openvas/gnupg
      - openvas_vt_data_vol:/var/lib/openvas/plugins
      - openvas_notus_data_vol:/var/lib/notus
      - openvas_ospd_socket_vol:/run/ospd
      - openvas_redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      openvas-redis:
        condition: service_started
      openvas-gpg-data:
        condition: service_completed_successfully
      openvas-configure:
        condition: service_completed_successfully
      openvas-vulnerability-tests:
        condition: service_healthy
      openvas-notus-data:
        condition: service_healthy
    networks:
      - openvas_network

networks:
  rengine_network:
  openvas_network:

volumes:
  tool_config:
  postgres18_data:
  nuclei_templates:
  generated_templates:
  github_repos:
  scan_results:
  static_volume:
  tailscale_state:
  tailscale_status:
  openvas_gpg_data_vol:
  openvas_scap_data_vol:
  openvas_cert_data_vol:
  openvas_data_objects_vol:
  openvas_gvmd_data_vol:
  openvas_psql_data_vol:
  openvas_vt_data_vol:
  openvas_notus_data_vol:
  openvas_psql_socket_vol:
  openvas_gvmd_socket_vol:
  openvas_ospd_socket_vol:
  openvas_redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:

secrets:
  proxy.ca:
    file: ./secrets/certs/rengine_chain.pem
  proxy.key:
    file: ./secrets/certs/rengine_rsa.key
  proxy.cert:
    file: ./secrets/certs/rengine.pem
