services:
  db:
    restart: always
    image: "postgres:18-alpine"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA in a version directory under /var/lib/postgresql, so mount there.
      # A new volume: the old PostgreSQL 12 data cannot be opened by 18 (see scripts/upgrade-postgres.sh).
      - postgres18_data:/var/lib/postgresql
    networks:
      - rengine_network

  redis:
    restart: always
    image: "redis:alpine"
    hostname: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # With a password in .env (new installs get one; scripts/enable-redis-auth.sh adds it to an older install) the broker refuses anyone
    # on the Docker network who does not have it. Without one it is open, as it always was.
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi"]
    networks:
      - rengine_network

  celery:
    mem_limit: "${CELERY_MEM_LIMIT:-4g}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see reNgine/ai_providers.py reachable_url)
    build:
      context: ./web
    restart: always
    entrypoint: /usr/src/app/celery-entrypoint.sh
    volumes:
      - ./web:/usr/src/app
      - github_repos:/usr/src/github
      - scan_results:/usr/src/scan_results
      - nuclei_templates:/root/nuclei-templates
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
      - static_volume:/usr/src/app/staticfiles/
      - tailscale_status:/var/run/tailscale-status:ro  # the optional tailscale profile's published node status, read-only (docs/TAILSCALE.md); empty without it
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-172.16.0.0/12}
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-3}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
    depends_on:
      - db
      - redis
    networks:
      - rengine_network

  celery-beat:
    mem_limit: "${BEAT_MEM_LIMIT:-512m}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    restart: always
    build: ./web
    entrypoint: /usr/src/app/beat-entrypoint.sh
    command: celery -A reNgine beat -l INFO --scheduler cveFeed.scan_control:PauseAwareScheduler
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-3}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
    depends_on:
      - celery
      - db
    volumes:
      - ./web:/usr/src/app
      - github_repos:/usr/src/github
      - scan_results:/usr/src/scan_results
      - nuclei_templates:/root/nuclei-templates
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
    networks:
      - rengine_network

  web:
    mem_limit: "${WEB_MEM_LIMIT:-1g}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see reNgine/ai_providers.py reachable_url)
    build:
      context: ./web
    entrypoint: /usr/src/app/entrypoint.sh
    # GUNICORN_WORKERS is pinned below (not read from .env): the lockout counters are in the shared Redis cache, so two workers is safe,
    # and a stray value in .env cannot change it
    restart: always
    image: cvengine/web:latest
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-172.16.0.0/12}
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-3}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - GUNICORN_WORKERS=2
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
    volumes:
      - ./web:/usr/src/app
      - github_repos:/usr/src/github
      - scan_results:/usr/src/scan_results
      - nuclei_templates:/root/nuclei-templates
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
      - static_volume:/usr/src/app/staticfiles/
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - celery
      - celery-beat
    networks:
      rengine_network:
        aliases:
          - rengine

  proxy:
    restart: always
    image: nginx:alpine
    # A stock image is only as new as the day it was first pulled: pull on every up, so an update brings nginx's security releases
    # whichever version of the update script is running (the one that applies an update is the one already on the host).
    pull_policy: always
    ports:
      - 8082:8082/tcp
      - 443:443/tcp
    depends_on:
      - web
      - db
      - redis
    secrets:
      - source: proxy.ca
        target: /etc/nginx/certs/rengine_chain.pem
      - source: proxy.cert
        target: /etc/nginx/certs/rengine.pem
      - source: proxy.key
        target: /etc/nginx/certs/rengine_rsa.key
    volumes:
      - ./config/nginx/rengine.conf:/etc/nginx/conf.d/rengine.conf:ro
      - static_volume:/usr/src/app/staticfiles/
      - scan_results:/usr/src/scan_results:ro
    networks:
      - rengine_network

  # Optional: attach this install to a Tailscale tailnet so Settings > Tailscale can scan its devices. Off unless COMPOSE_PROFILES=tailscale is
  # in .env (or `docker compose --profile tailscale up -d`); the rest of the stack is the same either way. docs/TAILSCALE.md has the steps.
  # It joins the celery container's network namespace (network_mode), which is where every scan runs: tailscaled puts the tailscale0
  # interface and the 100.64.0.0/10 route there, so scans reach the tailnet with no routing changes and no extra privileges for celery.
  # tailscaled's own control socket stays inside this container (root on it can reconfigure the node, and every container runs as root).
  # What celery reads is a status.json this container rewrites every 15 seconds, in a volume celery mounts read-only; a stale file means
  # the node is down. --shields-up refuses connections INTO the scanner's namespace from other devices. The auth key is read from
  # .env.tailscale, not .env, so it is not handed to every other container; without it (and without a saved node state) the service stops
  # with a message instead of printing a login URL.
  tailscale:
    profiles: ["tailscale"]
    # Pinned on purpose: this container sits inside the scanner's namespace. To update, change the tag (releases and the security
    # bulletins are at https://tailscale.com/security-bulletins) or set TAILSCALE_IMAGE in .env, then `docker compose up -d tailscale`.
    image: "${TAILSCALE_IMAGE:-tailscale/tailscale:v1.104.2}"
    restart: always
    network_mode: "service:celery"
    depends_on:
      - celery
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - path: .env.tailscale
        required: false
    environment:
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_HOSTNAME=${TAILSCALE_HOSTNAME:-cvengine}
      - TS_ACCEPT_DNS=false  # scans use addresses; MagicDNS names are shown from the device list
      - TS_AUTH_ONCE=true  # the key is only needed to enrol; the node's own state keeps it signed in afterwards
      - TS_EXTRA_ARGS=--shields-up ${TAILSCALE_EXTRA_ARGS:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$TS_AUTHKEY" ] && [ ! -s "$$TS_STATE_DIR/tailscaled.state" ]; then
          echo "tailscale: no TS_AUTHKEY and no saved node state. Put TS_AUTHKEY=... in .env.tailscale (see docs/TAILSCALE.md); not starting, so no login URL is printed." >&2
          sleep 30
          exit 1
        fi
        (while true; do
          if tailscale --socket="$$TS_SOCKET" status --json > /status/status.tmp 2>/dev/null; then
            sed 's/"AuthURL": *"[^"]*"/"AuthURL": ""/' /status/status.tmp > /status/status.new && mv /status/status.new /status/status.json
          else
            rm -f /status/status.json
          fi
          sleep 15
        done) &
        exec /usr/local/bin/containerboot
    volumes:
      - tailscale_state:/var/lib/tailscale
      - tailscale_status:/status

networks:
  rengine_network:

volumes:
  tool_config:
  postgres18_data:
  nuclei_templates:
  generated_templates:
  github_repos:
  scan_results:
  static_volume:
  tailscale_state:
  tailscale_status:

secrets:
  proxy.ca:
    file: ./secrets/certs/rengine_chain.pem
  proxy.key:
    file: ./secrets/certs/rengine_rsa.key
  proxy.cert:
    file: ./secrets/certs/rengine.pem
