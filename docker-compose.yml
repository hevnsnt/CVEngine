# Every container's log rotates: Docker's json-file driver keeps at most CVENGINE_LOG_MAX_FILE files of CVENGINE_LOG_MAX_SIZE each per container
# (default 5 x 50 MB), instead of one file that grows until the disk is full. The database writes its connection log here too (log_connections).
# A change recreates the containers once (an update does that for the application anyway; db and redis once, on the update that brings it).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${CVENGINE_LOG_MAX_SIZE:-50m}"
    max-file: "${CVENGINE_LOG_MAX_FILE:-5}"

# web, celery, celery-beat and the one-off migrate service run as the image's unprivileged account (uid 10002, web/Dockerfile), with every Linux
# capability dropped (none is needed: the server listens on 8000 and runs no scan tool, so not even NET_BIND_SERVICE or NET_RAW) and no way to
# gain privileges (no-new-privileges: a setuid binary does not raise them). They run the image's own copy of the source: ./web is NOT mounted over
# it, so nothing they could write is ever imported. The host's web/ folder is mounted at /var/lib/cvengine/web for what the host and the
# application exchange (the Django secret, the update channel: docs/UPDATES.md); its folder has the sticky bit and the application owns only its
# own requests in it (web/ownership.sh). docs/DEPLOYMENT.md, "Who the containers run as".
x-app-hardening: &app-hardening
  user: "10002:10002"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    restart: always
    image: "postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71"
    # Every worker task holds a database connection while it runs (gevent greenlets, no pooling), and the discovery worker alone may run up to 32
    # at once: PostgreSQL's default of 100 connections is too few. An update recreates this container once when this line changes (scripts/update.sh).
    # The memory settings default to what this file always used (work_mem 4MB and no preloaded library are PostgreSQL's own defaults); a bigger host
    # raises them in .env (docs/DEPLOYMENT.md, Sizing the database). POSTGRES_SHARED_PRELOAD_LIBRARIES=pg_stat_statements turns on query statistics.
    # POSTGRES_TRACK_IO_TIMING (off) and POSTGRES_LOG_MIN_DURATION_STATEMENT (-1, no slow query log) are diagnostics, PostgreSQL's own defaults when unset.
    # Two diagnostics are on by default (POSTGRES_LOG_LOCK_WAITS, POSTGRES_TRACK_WAL_IO_TIMING; off turns either off): a statement that waits longer
    # than deadlock_timeout (1s) for a lock is logged with the process that holds it, and the time spent writing and flushing WAL is counted (pg_stat_io).
    # Every login and logout is logged (POSTGRES_LOG_CONNECTIONS, POSTGRES_LOG_DISCONNECTIONS, default on; off turns either off): who connected, from
    # where, as which role. A setting given here wins over one made with ALTER SYSTEM.
    # Commits do not wait for their WAL flush (synchronous_commit=off, POSTGRES_SYNCHRONOUS_COMMIT): on a disk that stalls, every commit used to
    # queue behind the flushes of the others. The trade: a crash of the server or the host can lose the last writes acknowledged in about 0.6 s
    # (three times wal_writer_delay, left at its 200 ms default), never corrupt anything. This application can accept that: progress, heartbeats
    # and task leases are re-derived or retried by the Sentinel, and scan results are written in their own transactions and a lost last write is
    # sent again. The writes that must survive a crash (audit rows, token revocations, address bans, validation budget) still commit durably
    # (usage_stamps.durable_commit). POSTGRES_SYNCHRONOUS_COMMIT=on in .env turns it back on (docs/CONFIGURATION.md); the update also removes an
    # ALTER SYSTEM value of it, so this line is the one source (scripts/update-deploy.sh).
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}",
              "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}", "-c", "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}",
              "-c", "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}", "-c", "work_mem=${POSTGRES_WORK_MEM:-4MB}",
              "-c", "shared_preload_libraries=${POSTGRES_SHARED_PRELOAD_LIBRARIES:-}", "-c", "track_io_timing=${POSTGRES_TRACK_IO_TIMING:-off}",
              "-c", "log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:--1}",
              "-c", "log_connections=${POSTGRES_LOG_CONNECTIONS:-on}", "-c", "log_disconnections=${POSTGRES_LOG_DISCONNECTIONS:-on}",
              "-c", "log_lock_waits=${POSTGRES_LOG_LOCK_WAITS:-on}", "-c", "track_wal_io_timing=${POSTGRES_TRACK_WAL_IO_TIMING:-on}",
              "-c", "synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-off}"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA in a version directory under /var/lib/postgresql, so mount there.
      # A new volume: the old PostgreSQL 12 data cannot be opened by 18 (see scripts/upgrade-postgres.sh).
      - postgres18_data:/var/lib/postgresql
    # Only the services that hold its password are on data_network (web, celery, celery-beat): not the proxy, the AI reviewer or the scanner.
    networks:
      - data_network
    logging: *default-logging

  redis:
    restart: always
    image: "redis:alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483"
    hostname: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # With a password in .env (new installs get one; scripts/enable-redis-auth.sh adds it to an older install) the broker refuses anyone
    # on the Docker network who does not have it. Without one it is open, as it always was.
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi"]
    networks:
      - data_network  # as the database: only web, celery and celery-beat reach it
    logging: *default-logging

  # The one-off ownership service (web/ownership.sh): hands the paths the application writes (its volumes, the Django secret and its own update
  # requests in the host's web/ folder) to the application's account, uid 10002, once and idempotently: an install from before this release
  # has them as root's. It runs and exits, as root with only the three capabilities chown needs, no network and no environment file. The update
  # scripts and `make up` run it after the build and before the migrate service; `docker compose up` runs it through depends_on.
  ownership:
    build:  # the same image as web (cvengine/web:latest), built with it
      context: ./web
    image: cvengine/web:latest
    entrypoint: /usr/src/app/ownership.sh
    user: "0:0"
    restart: "no"
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      - CVENGINE_HOST_DIR=/var/lib/cvengine/web
    volumes:
      - ./web:/var/lib/cvengine/web
      - scan_results:/usr/src/scan_results
      - generated_templates:/root/cvengine-generated-templates
      - tool_config:/home/cvengine/.config
      - db_owner_fallback:/var/lib/cvengine-db-owner
      - static_volume:/usr/src/app/staticfiles
      - scanner_bootstrap:/var/lib/cvengine-scanner
      - reviewer_bootstrap:/var/lib/cvengine-reviewer
    logging: *default-logging

  # The one-off database owner service. It is the ONLY container that gets the owner role's password (POSTGRES_PASSWORD: the role the
  # database image created, a superuser on a stock install) and DJANGO_SUPERUSER_PASSWORD (from .env). It runs, then exits (web/migrate-entrypoint.sh): the
  # migrations, then `manage.py db_app_role gate`, which creates or updates the least privilege app role web, celery and celery-beat connect as,
  # grants it, and checks that it logs in. `docker compose up` runs it before them (their depends_on), and the update scripts and `make up` run
  # it before they start them. Other owner commands run here too: `docker compose run --rm migrate python3 manage.py createsuperuser` (make
  # username, make admin, make migrate, make test). When the app role cannot be used the gate exits 1 with the one-line fix and the application
  # is not started: it is never given the owner password by accident. CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 in .env is the explicit way to run it
  # on the owner role: the gate then writes the owner password to the db_owner_fallback volume, which web, celery and celery-beat mount
  # read-only, and removes it again once the app role works (docs/CONFIGURATION.md, Database roles). Not long running: restart "no".
  migrate:
    build:  # the same image as web (cvengine/web:latest), built with it
      context: ./web
    image: cvengine/web:latest
    entrypoint: /usr/src/app/migrate-entrypoint.sh
    restart: "no"
    <<: *app-hardening
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_ROLE=owner
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}
      - CVENGINE_DB_OWNER_FALLBACK_FILE=/var/lib/cvengine-db-owner/password
      - CVENGINE_HOME=/var/lib/cvengine/web  # the Django secret (web/secret) is read from the host's web/ folder
      - CVENGINE_HOST_DIR=/var/lib/cvengine/web
    volumes:
      - ./web:/var/lib/cvengine/web:ro  # the Django secret only; the ownership service creates it on a first start
      - db_owner_fallback:/var/lib/cvengine-db-owner
    depends_on:
      ownership:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - data_network  # the database (and Redis, which Django's settings name), nothing else
    logging: *default-logging

  celery:
    mem_limit: "${CELERY_MEM_LIMIT:-4g}"  # container ceiling; heavy scanner jobs queue inside it (cvengine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see cvengine/ai_providers.py reachable_url)
    build:
      context: ./web  # the Sentinel library is the commit web/requirements.txt pins (web/Dockerfile)
    restart: always
    <<: *app-hardening
    # An init process (tini) as PID 1 reaps the scanners' children and passes SIGTERM on to the entrypoint, which turns it into a warm shutdown of
    # the workers and exits when any one of them dies, so `restart: always` brings back all four. 60 s matches the update scripts' stop timeout.
    init: true
    stop_grace_period: 60s
    entrypoint: /usr/src/app/celery-entrypoint.sh
    # Healthy while all four workers answer a ping and consume their own queue (web/celery_healthcheck.py). Docker only RESTARTS an unhealthy container under an
    # orchestrator, so the real guard is the entrypoint, which exits when any worker process is gone; this feeds `docker ps`, the system status page and the update's
    # last check. start_period covers the entrypoint's start work (migrations wait, collectstatic, the template and whatportis updates).
    healthcheck:
      test: ["CMD", "python3", "celery_healthcheck.py"]
      interval: 60s
      timeout: 40s
      retries: 3
      start_period: 10m
    volumes:
      - ./web:/var/lib/cvengine/web  # the host's web/ folder: the Django secret and the update channel (the watchdog's and the scanner's requests), NOT the source
      - scan_results:/usr/src/scan_results
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/home/cvengine/.config  # HOME's .config: the CVE seed folder (cveFeed/seed_admin.py)
      - db_owner_fallback:/var/lib/cvengine-db-owner:ro  # empty unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (the migrate service writes it)
      - static_volume:/usr/src/app/staticfiles/  # the ONLY service that writes it (collectstatic at start and in the update); the proxy serves it, web reads it
      - tailscale_status:/var/run/tailscale-status:ro  # the optional tailscale profile's published node status, read-only (docs/TAILSCALE.md); empty without it
      - scanner_bootstrap:/var/lib/cvengine-scanner  # where the server leaves the built-in scanner's one-time enrollment (agentapi/builtin_scanner.py); empty unless CVENGINE_BUILTIN_SCANNER=1
      - reviewer_bootstrap:/var/lib/cvengine-reviewer  # where the server leaves the AI reviewer container's token (agentapi/builtin_reviewer.py)
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-${CVENGINE_PROXY_ADDRESS:-172.16.238.10}}  # the bundled proxy alone (its fixed address, networks below)
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=  # empty on purpose: the owner password is only in the one-off migrate service (this also blanks the one .env would pass)
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}  # the least privilege role the server runs as (docs/CONFIGURATION.md, Database roles)
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}  # generated by the update and make up (scripts/db-app-role.sh)
      - DJANGO_SUPERUSER_PASSWORD=  # empty: only make admin needs it, and that runs in the migrate service
      - CVENGINE_DB_OWNER_FALLBACK_FILE=/var/lib/cvengine-db-owner/password  # absent unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (docs/CONFIGURATION.md)
      - CVENGINE_HOME=/var/lib/cvengine/web  # the Django secret and the update lock, in the host's web/ folder
      - CVENGINE_HOST_DIR=/var/lib/cvengine/web  # the update channel's files (cveFeed/updater.py host_dir)
    depends_on:
      migrate:  # the one-off owner service: migrations, the app role and its check; nothing starts when it fails
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - cvengine_network
      - data_network  # the database and Redis
    logging: *default-logging

  celery-beat:
    mem_limit: "${BEAT_MEM_LIMIT:-512m}"  # container ceiling; heavy scanner jobs queue inside it (cvengine/resources.py)
    restart: always
    build: ./web
    <<: *app-hardening
    entrypoint: /usr/src/app/beat-entrypoint.sh
    command: celery -A cvengine beat -l INFO --scheduler cveFeed.scan_control:PauseAwareScheduler
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=  # empty on purpose: the owner password is only in the one-off migrate service (this also blanks the one .env would pass)
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}  # the least privilege role the server runs as (docs/CONFIGURATION.md, Database roles)
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}  # generated by the update and make up (scripts/db-app-role.sh)
      - DJANGO_SUPERUSER_PASSWORD=  # empty: only make admin needs it, and that runs in the migrate service
      - CVENGINE_DB_OWNER_FALLBACK_FILE=/var/lib/cvengine-db-owner/password  # absent unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (docs/CONFIGURATION.md)
      - CVENGINE_HOME=/var/lib/cvengine/web  # the Django secret and the update lock, in the host's web/ folder
      - CVENGINE_HOST_DIR=/var/lib/cvengine/web  # the update channel's files (cveFeed/updater.py host_dir)
    depends_on:
      migrate:  # the one-off owner service: migrations, the app role and its check; nothing starts when it fails
        condition: service_completed_successfully
      celery:
        condition: service_started
      db:
        condition: service_started
    volumes:
      - ./web:/var/lib/cvengine/web:ro  # the Django secret; Beat only schedules (its schedule is in the database) and writes none of these
      - scan_results:/usr/src/scan_results:ro
      - generated_templates:/root/cvengine-generated-templates:ro
      - tool_config:/home/cvengine/.config:ro
      - db_owner_fallback:/var/lib/cvengine-db-owner:ro  # empty unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (the migrate service writes it)
    networks:
      - cvengine_network
      - data_network  # the database and Redis
    logging: *default-logging

  web:
    mem_limit: "${WEB_MEM_LIMIT:-1g}"  # container ceiling; heavy scanner jobs queue inside it (cvengine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see cvengine/ai_providers.py reachable_url)
    build:
      context: ./web  # the Sentinel library is the commit web/requirements.txt pins (web/Dockerfile)
    <<: *app-hardening
    entrypoint: /usr/src/app/entrypoint.sh
    # GUNICORN_WORKERS is pinned below (not read from .env): the lockout counters are in the shared Redis cache, so two workers is safe,
    # and a stray value in .env cannot change it
    restart: always
    image: cvengine/web:latest
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-${CVENGINE_PROXY_ADDRESS:-172.16.238.10}}  # the bundled proxy alone (its fixed address, networks below)
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - GUNICORN_WORKERS=2
      - CVENGINE_DB_CONN_MAX_AGE=${CVENGINE_DB_CONN_MAX_AGE:-60}  # web threads keep their database connection for a minute (16 at most); workers do not (docs/DEPLOYMENT.md, Small hosts)
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=  # empty on purpose: the owner password is only in the one-off migrate service (this also blanks the one .env would pass)
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CVENGINE_DB_APP_USER=${CVENGINE_DB_APP_USER-cvengine_app}  # the least privilege role the server runs as (docs/CONFIGURATION.md, Database roles)
      - CVENGINE_DB_APP_PASSWORD=${CVENGINE_DB_APP_PASSWORD:-}  # generated by the update and make up (scripts/db-app-role.sh)
      - DJANGO_SUPERUSER_PASSWORD=  # empty: only make admin needs it, and that runs in the migrate service
      - CVENGINE_DB_OWNER_FALLBACK_FILE=/var/lib/cvengine-db-owner/password  # absent unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (docs/CONFIGURATION.md)
      - CVENGINE_HOME=/var/lib/cvengine/web  # the Django secret and the update lock, in the host's web/ folder
      - CVENGINE_HOST_DIR=/var/lib/cvengine/web  # the update channel's files (cveFeed/updater.py host_dir)
    volumes:
      - ./web:/var/lib/cvengine/web  # the host's web/ folder: the Django secret and the update channel (Settings > Updates writes its requests here), NOT the source
      - scan_results:/usr/src/scan_results
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/home/cvengine/.config
      - db_owner_fallback:/var/lib/cvengine-db-owner:ro  # empty unless CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 (the migrate service writes it)
      - static_volume:/usr/src/app/staticfiles/:ro  # read only: only celery writes the static files the proxy serves
    # No published port: the bundled proxy is the way in, and the built-in scanner and the AI reviewer reach http://web:8000 on their own networks. A
    # port on 127.0.0.1 let any local process reach the server from the Docker gateway, past the proxy. Opt in with docker-compose.webport.yml (your
    # own reverse proxy on this host, docs/DEPLOYMENT.md); docker-compose.hostnet.yml publishes it for the scanner it moves to the host network.
    depends_on:
      migrate:  # the one-off owner service: migrations, the app role and its check; nothing starts when it fails
        condition: service_completed_successfully
      db:
        condition: service_started
      celery:
        condition: service_started
      celery-beat:
        condition: service_started
    networks:
      cvengine_network: {}
      proxy_network:  # the bundled proxy reaches it here, as "cvengine" (config/nginx/cvengine.conf): the name exists on this network only (see proxy)
        aliases:
          - cvengine
      scanner_network: {}  # the built-in scanner reaches the server here (http://web:8000), and nothing else of the stack
      data_network: {}  # the database and Redis (the proxy, the AI reviewer and the scanner are not on it)
    logging: *default-logging

  proxy:
    restart: always
    image: nginx:alpine@sha256:b50897d5c7b1aa08067c3d90c5e8b3e47ec4e3c91c91446f67820228f7b41e34
    # A stock image is only as new as the day it was first pulled. The update scripts pull it before they build, while nothing is stopped, and
    # keep the image on the host when the registry cannot be reached: `pull_policy: always` made the pull part of `up`, which runs after the
    # database migration, so a registry outage failed an update that was otherwise done and an offline host could never update.
    ports:
      - ${CVENGINE_HTTP_PORT:-8082}:8082/tcp  # both host ports can be moved (CVENGINE_HTTPS_PORT, CVENGINE_HTTP_PORT in .env) when another program holds 443
      - ${CVENGINE_HTTPS_PORT:-443}:443/tcp
    depends_on:
      - web
      - db
      - redis
    secrets:
      - source: proxy.ca
        target: /etc/nginx/certs/cvengine_chain.pem
      - source: proxy.cert
        target: /etc/nginx/certs/cvengine.pem
      - source: proxy.key
        target: /etc/nginx/certs/cvengine_rsa.key
    volumes:
      - ./config/nginx/cvengine.conf:/etc/nginx/conf.d/cvengine.conf:ro
      - ./web/static/cve/maintenance.html:/usr/share/nginx/maintenance/maintenance.html:ro
      - ./config/nginx/state:/etc/nginx/state:ro  # holds the maintenance flag while an update runs
      - ./config/nginx/trusted-upstreams.conf:/etc/nginx/trusted-upstreams.conf:ro  # empty: no peer is believed to have set X-Forwarded-For (HOSTING-ONLINE.md, Cloudflare Tunnel)
      # rendered at start into conf.d/cvengine-upstream-secret.inc: the secret a host nginx sends to have its X-Forwarded-For believed on 443
      - ./config/nginx/templates:/etc/nginx/templates:ro
      - static_volume:/usr/src/app/staticfiles/:ro
      - scan_results:/usr/src/scan_results:ro
    environment:
      # Empty (the default until an update or make up generates it): no X-Forwarded-For is believed on 443 (config/nginx/cvengine.conf, "Client addresses")
      CVENGINE_UPSTREAM_SECRET: "${CVENGINE_UPSTREAM_SECRET:-}"
    networks:
      cvengine_network: {}  # as before, for anything an install's overlay puts beside it (a cloudflared container); not used to reach web
      proxy_network:
        # A fixed address: the web service believes X-Forwarded-For from this one address and no other (CVENGINE_TRUSTED_PROXIES above). It must lie
        # in CVENGINE_PROXY_SUBNET and outside CVENGINE_PROXY_RANGE, where Docker places the web container. The proxy reaches web by the name
        # "cvengine" (config/nginx/cvengine.conf), which web carries on this network only, so its requests always come from this address.
        ipv4_address: "${CVENGINE_PROXY_ADDRESS:-172.16.238.10}"
    logging: *default-logging

  # Optional: attach this install to a Tailscale tailnet so Settings > Tailscale can scan its devices. Off unless COMPOSE_PROFILES=tailscale is
  # in .env (or `docker compose --profile tailscale up -d`); the rest of the stack is the same either way. docs/TAILSCALE.md has the steps.
  # It joins the built-in scanner's network namespace (network_mode), which is where every scan of this install runs: tailscaled puts the tailscale0
  # interface and the 100.64.0.0/10 route there, so scans reach the tailnet with no routing changes and no extra privileges for the scanner. The
  # server's own containers are not on the tailnet: they only read the node status below and call the Tailscale API over the internet.
  # It needs the scanner: with CVENGINE_BUILTIN_SCANNER=0 it is not started (a Sentinel on a tailnet machine scans the tailnet then).
  # tailscaled's own control socket stays inside this container (root on it can reconfigure the node).
  # What celery reads is a status.json this container rewrites every 15 seconds, in a volume celery mounts read-only; a stale file means
  # the node is down. --shields-up refuses connections INTO the scanner's namespace from other devices. The auth key is read from
  # .env.tailscale, not .env, so it is not handed to every other container; without it (and without a saved node state) the service stops
  # with a message instead of printing a login URL. Recreating the scanner leaves this container in a dead namespace, so scripts/scanner.sh
  # recreates it after every scanner start (cvengine_scanner_sidecar).
  tailscale:
    profiles: ["tailscale"]
    # Pinned on purpose: this container sits inside the scanner's namespace. To update, change the tag (releases and the security
    # bulletins are at https://tailscale.com/security-bulletins) or set TAILSCALE_IMAGE in .env, then `docker compose up -d tailscale`.
    image: "${TAILSCALE_IMAGE:-tailscale/tailscale:v1.104.7}"
    restart: always
    network_mode: "service:scanner"
    depends_on:
      - scanner
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - path: .env.tailscale
        required: false
    environment:
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_HOSTNAME=${TAILSCALE_HOSTNAME:-cvengine}
      - TS_ACCEPT_DNS=false  # scans use addresses; MagicDNS names are shown from the device list
      - TS_AUTH_ONCE=true  # the key is only needed to enrol; the node's own state keeps it signed in afterwards
      - TS_EXTRA_ARGS=--shields-up ${TAILSCALE_EXTRA_ARGS:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$TS_AUTHKEY" ] && [ ! -s "$$TS_STATE_DIR/tailscaled.state" ]; then
          echo "tailscale: no TS_AUTHKEY and no saved node state. Put TS_AUTHKEY=... in .env.tailscale (see docs/TAILSCALE.md); not starting, so no login URL is printed." >&2
          sleep 30
          exit 1
        fi
        (while true; do
          if tailscale --socket="$$TS_SOCKET" status --json > /status/status.tmp 2>/dev/null; then
            sed 's/"AuthURL": *"[^"]*"/"AuthURL": ""/' /status/status.tmp > /status/status.new && mv /status/status.new /status/status.json
          else
            rm -f /status/status.json
          fi
          sleep 15
        done) &
        exec /usr/local/bin/containerboot
    volumes:
      - tailscale_state:/var/lib/tailscale
      - tailscale_status:/status
    logging: *default-logging

  # The built-in scanner ("CVEngine Scanner", docs/BUILTIN-SCANNER.md): the cvENGINE Sentinel image running next to the server, enrolled by it with nobody
  # typing a secret, and where every scan tool runs (docs/SCANNER-ARCHITECTURE.md). On by default; CVENGINE_BUILTIN_SCANNER=0 in .env turns it off (the
  # server then writes no enrollment and revokes the scanner's token, and the container idles).
  # No container_name: it was a fixed name that a second stack on the same host collided with. Compose names the container <project>-scanner-1; every
  # script and doc reaches it by the service name (`make scanner-logs`, `docker compose logs scanner`).
  # The image FOLLOWS the newest published Sentinel: the moving tag `main` of ghcr.io/hevnsnt/cvengine-sentinel (the newest build of the Sentinel's main
  # branch, which only receives code after its checks pass; amd64 and arm64, with an SBOM and build provenance). scripts/scanner_lock.py keeps this default
  # equal to the tag scanner.lock.json names; the lock itself is the known-good floor the release was tested with, not a pin. Every update and a
  # schedule (scripts/scanner.sh, scripts/scanner-update.sh) pull the tag, start the new container and keep it only once it is healthy AND has checked in with
  # a contract version the server accepts, else they put the previous image back (CVENGINE_SCANNER_ROLLBACK_IMAGE, which they write and clear).
  # TO HOLD THE SCANNER AT ONE VERSION set CVENGINE_SCANNER_IMAGE in .env to a digest or a tag: it is used as it is and never pulled over or rolled back.
  # pull_policy is `missing` on purpose, like the proxy's above: `always` makes the pull part of `up`, and a registry that cannot be reached would then stop
  # the whole stack from starting. The scripts fetch the newest image before anything is stopped and tolerate a failed pull; a host that starts the stack
  # with plain `docker compose up` and wants it to pull each time sets CVENGINE_SCANNER_PULL_POLICY=always (and accepts that an outage fails that `up`).
  # It has a network of its own (scanner_network), which it shares with nothing but the web service: every scan of this install leaves from here, and the
  # server's containers (celery included) carry no scan traffic and need no scanning privileges. It reaches the server as http://web:8000 and nothing
  # else of the stack (not PostgreSQL, not Redis). The Tailscale sidecar joins this container's namespace, and the host network and macvlan overlays
  # (docker-compose.hostnet.yml, docker-compose.macvlan.yml) move this container, not celery. Nothing connects to it.
  scanner:
    image: "${CVENGINE_SCANNER_IMAGE:-${CVENGINE_SCANNER_ROLLBACK_IMAGE:-ghcr.io/hevnsnt/cvengine-sentinel@sha256:90352e819e06456fe86c711b16ec8d6d03e879bd17bdb63bc38ef7fc9970e00b}}"
    pull_policy: "${CVENGINE_SCANNER_PULL_POLICY:-missing}"
    restart: unless-stopped
    init: true
    networks:
      - scanner_network
    stop_grace_period: 75s
    pids_limit: 512
    # 3 GB. The scanner weighs every kind of work against this limit and never starts one that would not fit (the Sentinel's client/admission.py: one nuclei run
    # measured 500-730 MB, the screenshot browser 224+ MB, nmap 70 MB), so a lower limit makes it run fewer things at once, not die. 2 GB is enough to run two
    # nuclei and a browser together; 3 GB runs three nuclei and a browser at once, the mix that was once killed at 2 GB. Lower it on a small host (docs/DEPLOYMENT.md, Memory).
    mem_limit: "${SCANNER_MEM_LIMIT:-3g}"
    # The same reduced set as the Sentinel's own compose file (SN-8): every capability dropped, then NET_RAW (nmap's SYN scan, OS detection and UDP sweep,
    # naabu's SYN scan, which reach the unprivileged daemon's tools through file capabilities on nmap and naabu alone) and SYS_CHROOT (Chromium's sandbox).
    # NET_ADMIN is gone: in this container's network namespace (the host's with the hostnet overlay, shared with the Tailscale sidecar) it would let a compromised tool change
    # the routes, firewall and interfaces. The third entry is empty in effect (it repeats SYS_CHROOT) unless scripts/scanner.sh finds an image from before the
    # reduction: its nmap and naabu carry `cap_net_raw,cap_net_admin+eip`, and the kernel refuses to start a binary whose file capabilities it cannot grant
    # (execve fails with EPERM), so the script writes CVENGINE_SCANNER_EXTRA_CAP=NET_ADMIN for exactly such an image and removes it again for a newer one
    # (docs/BUILTIN-SCANNER.md, "Capabilities"). Not set here: read_only (bbot's discovery needs a writable ~/.bbot/tools) and no-new-privileges (it makes the
    # kernel ignore file capabilities, so raw sockets would depend on the container engine's version).
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - SYS_CHROOT
      - "${CVENGINE_SCANNER_EXTRA_CAP:-SYS_CHROOT}"
    # Chromium's sandbox for the web screenshots (kind web_screenshot, docs/PIPELINE.md, "Web screenshots") needs user namespaces, which Docker's default
    # seccomp profile refuses. This is Playwright's own profile for running Chromium with its sandbox in Docker (Docker's default plus clone, setns and
    # unshare), vendored unchanged from microsoft/playwright v1.64.1 (see THIRD-PARTY.md). The browser runs in this container and nowhere else; without
    # the profile the scanner's sandbox proof fails and it takes no picture, with the reason shown. `make up` and the update scripts recreate this
    # container, so an upgrade applies it with no manual step.
    # On a host whose AppArmor refuses user namespaces (Ubuntu 24.04+, recent Debian and Kali) the browser still cannot start: load
    # config/apparmor/cvengine-scanner (`sudo apparmor_parser -r -W config/apparmor/cvengine-scanner`) and use docker-compose.apparmor.yml (or
    # uncomment the line below, which edits a tracked file the updater then refuses to fast-forward over). `apparmor=unconfined` also works but removes the container's AppArmor confinement altogether. docs/DEPLOYMENT.md,
    # "Screenshots and AppArmor".
    security_opt:
      - seccomp=./config/seccomp/playwright-chromium.json
      # - apparmor=cvengine-scanner
    healthcheck:
      # Healthy while its heartbeats reach the server (python3 -m client.control health); it also restarts itself after three minutes without one.
      test: ["CMD", "python3", "-m", "client.control", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m  # covers the wait for the server's enrollment on a first start
    environment:
      CVENGINE_SENTINEL_BUILTIN: "1"
      CVENGINE_SENTINEL_BLOB_FILE: /bootstrap/blob  # the enrollment the server writes (agentapi/builtin_scanner.py); read again whenever it re-enrols
      CVENGINE_SENTINEL_ALLOW_INSECURE: "1"  # it talks to the server over the compose network, in plain http
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-},web,localhost,127.0.0.1"  # the server is never reached through a host proxy
    # The image's own user (sentinel, uid 10001) plus group 10002, the server's: the enrollment blob is 0640 and group 10002 in a folder of mode
    # 2751 (agentapi/builtin_scanner.py, web/ownership.sh), so the scanner reads it and nobody else does.
    group_add:
      - "10002"
    volumes:
      - scanner_bootstrap:/bootstrap:ro
      - scanner_state:/var/lib/cvengine-sentinel
    depends_on:
      - web
    logging: *default-logging

  # The AI reviewer (docs/AI-REVIEWER.md): reviews every open finding once and checks the server's operations a few times a day, with the
  # provider and models chosen in Settings > AI model. It is boxed in on purpose: its own small image (./reviewer) with no cvENGINE source,
  # no database or Redis credentials, a read-only filesystem, no capabilities, an unprivileged user. It talks to the server only over
  # /api/v1/reviewer/* with a reviewer-scope token the server writes to reviewer_bootstrap, and to the AI provider. It idles until an AI
  # provider is configured; CVENGINE_REVIEWER=0 in .env turns it off.
  reviewer:
    build:
      context: ./reviewer
    image: cvengine-reviewer-local:latest
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "10002:10002"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: "${REVIEWER_MEM_LIMIT:-256m}"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # a local model server (LM Studio, Ollama, vLLM) on this machine, as Settings > AI model allows
    environment:
      CVENGINE_REVIEWER_SERVER: "http://web:8000"
      CVENGINE_REVIEWER_TOKEN_FILE: "/bootstrap/token"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-web,localhost,127.0.0.1}"
    volumes:
      - reviewer_bootstrap:/bootstrap:ro
    depends_on:
      - web
    # web only (http://web:8000) and the AI provider: it is not on data_network, so it cannot even reach the database's or Redis's login.
    networks:
      - cvengine_network
    logging: *default-logging

networks:
  cvengine_network:
  # The bundled proxy and the web service only, on a fixed subnet so the proxy has a fixed address (see proxy). 172.16.0.0/16 is outside Docker's
  # default pools (172.17 to 172.31, then 192.168), so it does not collide with the networks Docker hands out; move the three values together
  # (CVENGINE_PROXY_SUBNET, CVENGINE_PROXY_RANGE, CVENGINE_PROXY_ADDRESS, docs/CONFIGURATION.md) when it collides with your LAN or another network.
  # A network of its own rather than a fixed subnet on cvengine_network: an existing network cannot change its subnet while containers are on it,
  # so an update would have had to take the whole stack off it first. A plain bridge, not `internal: true`: the proxy publishes ports.
  proxy_network:
    ipam:
      config:
        - subnet: "${CVENGINE_PROXY_SUBNET:-172.16.238.0/24}"
          ip_range: "${CVENGINE_PROXY_RANGE:-172.16.238.128/25}"
  scanner_network:  # the built-in scanner and the web service only (see scanner above)
  # The database and Redis, and the three services that hold their passwords (web, celery, celery-beat). A plain bridge, not `internal: true`:
  # the database's published port (127.0.0.1:5432) needs a network with a gateway, and an internal one would drop it.
  data_network:

volumes:
  tool_config:
  db_owner_fallback:  # the owner password, only while CVENGINE_DB_ALLOW_OWNER_FALLBACK=1 needs it (see migrate above)
  postgres18_data:
  generated_templates:
  scan_results:
  static_volume:
  tailscale_state:
  tailscale_status:
  scanner_bootstrap:
  reviewer_bootstrap:
  scanner_state:

secrets:
  proxy.ca:
    file: ./secrets/certs/cvengine_chain.pem
  proxy.key:
    file: ./secrets/certs/cvengine_rsa.key
  proxy.cert:
    file: ./secrets/certs/cvengine.pem
