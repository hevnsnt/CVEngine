services:
  db:
    restart: always
    image: "postgres:18-alpine"
    # Every worker task holds a database connection while it runs (gevent greenlets, no pooling), and the discovery worker alone may run up to 32
    # at once: PostgreSQL's default of 100 connections is too few. An update recreates this container once when this line changes (scripts/update.sh).
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}",
              "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}", "-c", "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}",
              "-c", "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA in a version directory under /var/lib/postgresql, so mount there.
      # A new volume: the old PostgreSQL 12 data cannot be opened by 18 (see scripts/upgrade-postgres.sh).
      - postgres18_data:/var/lib/postgresql
    networks:
      - rengine_network

  redis:
    restart: always
    image: "redis:alpine"
    hostname: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # With a password in .env (new installs get one; scripts/enable-redis-auth.sh adds it to an older install) the broker refuses anyone
    # on the Docker network who does not have it. Without one it is open, as it always was.
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi"]
    networks:
      - rengine_network

  celery:
    mem_limit: "${CELERY_MEM_LIMIT:-4g}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see reNgine/ai_providers.py reachable_url)
    build:
      context: ./web
      args:  # the Sentinel library the image installs (web/Dockerfile): the newest build of SENTINEL_REF (default main), resolved to SENTINEL_SHA by scripts/sentinel-ref.sh at build time
        SENTINEL_REF: "${SENTINEL_REF:-main}"
        SENTINEL_SHA: "${SENTINEL_SHA:-}"
    restart: always
    # An init process (tini) as PID 1 reaps the scanners' children and passes SIGTERM on to the entrypoint, which turns it into a warm shutdown of
    # the workers and exits when any one of them dies, so `restart: always` brings back all four. 60 s matches the update scripts' stop timeout.
    init: true
    stop_grace_period: 60s
    entrypoint: /usr/src/app/celery-entrypoint.sh
    # Healthy while all four workers answer a ping and consume their own queue (web/celery_healthcheck.py). Docker only RESTARTS an unhealthy container under an
    # orchestrator, so the real guard is the entrypoint, which exits when any worker process is gone; this feeds `docker ps`, the system status page and the update's
    # last check. start_period covers the entrypoint's start work (migrations wait, collectstatic, the template and whatportis updates).
    healthcheck:
      test: ["CMD", "python3", "celery_healthcheck.py"]
      interval: 60s
      timeout: 40s
      retries: 3
      start_period: 10m
    volumes:
      - ./web:/usr/src/app
      - github_repos:/usr/src/github
      - scan_results:/usr/src/scan_results
      - nuclei_templates:/root/nuclei-templates
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
      - static_volume:/usr/src/app/staticfiles/
      - tailscale_status:/var/run/tailscale-status:ro  # the optional tailscale profile's published node status, read-only (docs/TAILSCALE.md); empty without it
      - scanner_bootstrap:/var/lib/cvengine-scanner  # where the server leaves the built-in scanner's one-time enrollment (agentapi/builtin_scanner.py); empty unless CVENGINE_BUILTIN_SCANNER=1
      - reviewer_bootstrap:/var/lib/cvengine-reviewer  # where the server leaves the AI reviewer container's token (agentapi/builtin_reviewer.py)
      - openvas_gvmd_socket_vol:/run/gvmd:ro  # the optional openvas profile's gvmd (GMP) socket (docs/OPENVAS.md); an empty directory without it, and only celery mounts it
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-172.16.0.0/12}
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
    depends_on:
      - db
      - redis
    networks:
      - rengine_network

  celery-beat:
    mem_limit: "${BEAT_MEM_LIMIT:-512m}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    restart: always
    build: ./web
    entrypoint: /usr/src/app/beat-entrypoint.sh
    command: celery -A reNgine beat -l INFO --scheduler cveFeed.scan_control:PauseAwareScheduler
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
    depends_on:
      - celery
      - db
    volumes:
      - ./web:/usr/src/app
      - github_repos:/usr/src/github
      - scan_results:/usr/src/scan_results
      - nuclei_templates:/root/nuclei-templates
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
    networks:
      - rengine_network

  web:
    mem_limit: "${WEB_MEM_LIMIT:-1g}"  # container ceiling; heavy scanner jobs queue inside it (reNgine/resources.py)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets "localhost" in Settings > AI model mean this server (see reNgine/ai_providers.py reachable_url)
    build:
      context: ./web
      args:  # the Sentinel library the image installs (web/Dockerfile): the newest build of SENTINEL_REF (default main), resolved to SENTINEL_SHA by scripts/sentinel-ref.sh at build time
        SENTINEL_REF: "${SENTINEL_REF:-main}"
        SENTINEL_SHA: "${SENTINEL_SHA:-}"
    entrypoint: /usr/src/app/entrypoint.sh
    # GUNICORN_WORKERS is pinned below (not read from .env): the lockout counters are in the shared Redis cache, so two workers is safe,
    # and a stray value in .env cannot change it
    restart: always
    image: cvengine/web:latest
    # every variable in .env reaches the container (the explicit entries below win, so the internal
    # settings compose sets on purpose, such as the broker URLs and DEBUG, cannot be overridden from .env)
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=0
      - CVENGINE_ALLOW_PRIVATE_TARGETS=${CVENGINE_ALLOW_PRIVATE_TARGETS:-0}
      - CVENGINE_TRUSTED_PROXIES=${CVENGINE_TRUSTED_PROXIES:-172.16.0.0/12}
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DISCOVERY_CONCURRENCY=${DISCOVERY_CONCURRENCY:-8}
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - GUNICORN_WORKERS=2
      - CVENGINE_DB_CONN_MAX_AGE=${CVENGINE_DB_CONN_MAX_AGE:-60}  # web threads keep their database connection for a minute (16 at most); workers do not (docs/DEPLOYMENT.md, Small hosts)
      - DOMAIN_NAME=${DOMAIN_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
    volumes:
      - ./web:/usr/src/app
      - github_repos:/usr/src/github
      - scan_results:/usr/src/scan_results
      - nuclei_templates:/root/nuclei-templates
      - generated_templates:/root/cvengine-generated-templates  # validated AI-written templates survive an update
      - tool_config:/root/.config
      - static_volume:/usr/src/app/staticfiles/
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - celery
      - celery-beat
    networks:
      rengine_network:
        aliases:
          - rengine

  proxy:
    restart: always
    image: nginx:alpine
    # A stock image is only as new as the day it was first pulled. The update scripts pull it before they build, while nothing is stopped, and
    # keep the image on the host when the registry cannot be reached: `pull_policy: always` made the pull part of `up`, which runs after the
    # database migration, so a registry outage failed an update that was otherwise done and an offline host could never update.
    ports:
      - ${CVENGINE_HTTP_PORT:-8082}:8082/tcp  # both host ports can be moved (CVENGINE_HTTPS_PORT, CVENGINE_HTTP_PORT in .env) when another program holds 443
      - ${CVENGINE_HTTPS_PORT:-443}:443/tcp
    depends_on:
      - web
      - db
      - redis
    secrets:
      - source: proxy.ca
        target: /etc/nginx/certs/rengine_chain.pem
      - source: proxy.cert
        target: /etc/nginx/certs/rengine.pem
      - source: proxy.key
        target: /etc/nginx/certs/rengine_rsa.key
    volumes:
      - ./config/nginx/rengine.conf:/etc/nginx/conf.d/rengine.conf:ro
      - ./web/static/cve/maintenance.html:/usr/share/nginx/maintenance/maintenance.html:ro
      - ./config/nginx/state:/etc/nginx/state:ro  # holds the maintenance flag while an update runs
      - ./config/nginx/trusted-upstreams.conf:/etc/nginx/trusted-upstreams.conf:ro  # empty: no peer is believed to have set X-Forwarded-For (HOSTING-ONLINE.md, Cloudflare Tunnel)
      - static_volume:/usr/src/app/staticfiles/
      - scan_results:/usr/src/scan_results:ro
    networks:
      - rengine_network

  # Optional: attach this install to a Tailscale tailnet so Settings > Tailscale can scan its devices. Off unless COMPOSE_PROFILES=tailscale is
  # in .env (or `docker compose --profile tailscale up -d`); the rest of the stack is the same either way. docs/TAILSCALE.md has the steps.
  # It joins the celery container's network namespace (network_mode), which is where every scan runs: tailscaled puts the tailscale0
  # interface and the 100.64.0.0/10 route there, so scans reach the tailnet with no routing changes and no extra privileges for celery.
  # tailscaled's own control socket stays inside this container (root on it can reconfigure the node, and every container runs as root).
  # What celery reads is a status.json this container rewrites every 15 seconds, in a volume celery mounts read-only; a stale file means
  # the node is down. --shields-up refuses connections INTO the scanner's namespace from other devices. The auth key is read from
  # .env.tailscale, not .env, so it is not handed to every other container; without it (and without a saved node state) the service stops
  # with a message instead of printing a login URL.
  tailscale:
    profiles: ["tailscale"]
    # Pinned on purpose: this container sits inside the scanner's namespace. To update, change the tag (releases and the security
    # bulletins are at https://tailscale.com/security-bulletins) or set TAILSCALE_IMAGE in .env, then `docker compose up -d tailscale`.
    image: "${TAILSCALE_IMAGE:-tailscale/tailscale:v1.104.6}"
    restart: always
    network_mode: "service:celery"
    depends_on:
      - celery
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - path: .env.tailscale
        required: false
    environment:
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_HOSTNAME=${TAILSCALE_HOSTNAME:-cvengine}
      - TS_ACCEPT_DNS=false  # scans use addresses; MagicDNS names are shown from the device list
      - TS_AUTH_ONCE=true  # the key is only needed to enrol; the node's own state keeps it signed in afterwards
      - TS_EXTRA_ARGS=--shields-up ${TAILSCALE_EXTRA_ARGS:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$TS_AUTHKEY" ] && [ ! -s "$$TS_STATE_DIR/tailscaled.state" ]; then
          echo "tailscale: no TS_AUTHKEY and no saved node state. Put TS_AUTHKEY=... in .env.tailscale (see docs/TAILSCALE.md); not starting, so no login URL is printed." >&2
          sleep 30
          exit 1
        fi
        (while true; do
          if tailscale --socket="$$TS_SOCKET" status --json > /status/status.tmp 2>/dev/null; then
            sed 's/"AuthURL": *"[^"]*"/"AuthURL": ""/' /status/status.tmp > /status/status.new && mv /status/status.new /status/status.json
          else
            rm -f /status/status.json
          fi
          sleep 15
        done) &
        exec /usr/local/bin/containerboot
    volumes:
      - tailscale_state:/var/lib/tailscale
      - tailscale_status:/status

  # The built-in scanner ("CVEngine Scanner", docs/BUILTIN-SCANNER.md): the cvENGINE Sentinel image running next to the server, enrolled by it with nobody
  # typing a secret, and where every scan tool runs (docs/SCANNER-ARCHITECTURE.md). On by default; CVENGINE_BUILTIN_SCANNER=0 in .env turns it off (the
  # server then writes no enrollment and revokes the scanner's token, and the container idles).
  # No container_name: it was a fixed name that a second stack on the same host collided with. Compose names the container <project>-scanner-1; every
  # script and doc reaches it by the service name (`make scanner-logs`, `docker compose logs scanner`).
  # The image FOLLOWS the newest published Sentinel: the moving tag `main` of ghcr.io/hevnsnt/cvengine-sentinel (the newest build of the Sentinel's main
  # branch, which only receives code after its checks pass; amd64 and arm64, with an SBOM and build provenance). scripts/scanner_lock.py keeps this default
  # equal to the tag scanner.lock.json names; the lock itself is the known-good floor the release was tested with, not a pin. Every update and a
  # schedule (scripts/scanner.sh, scripts/scanner-update.sh) pull the tag, start the new container and keep it only once it is healthy AND has checked in with
  # a contract version the server accepts, else they put the previous image back (CVENGINE_SCANNER_ROLLBACK_IMAGE, which they write and clear).
  # TO HOLD THE SCANNER AT ONE VERSION set CVENGINE_SCANNER_IMAGE in .env to a digest or a tag: it is used as it is and never pulled over or rolled back.
  # pull_policy is `missing` on purpose, like the proxy's above: `always` makes the pull part of `up`, and a registry that cannot be reached would then stop
  # the whole stack from starting. The scripts fetch the newest image before anything is stopped and tolerate a failed pull; a host that starts the stack
  # with plain `docker compose up` and wants it to pull each time sets CVENGINE_SCANNER_PULL_POLICY=always (and accepts that an outage fails that `up`).
  # It shares the celery container's network namespace, so its scans leave from exactly where the server's own did: the same address, the Tailscale
  # sidecar's tailnet route (which lives in that namespace too) and the host network or macvlan overlays. Nothing connects to it; it reaches
  # the server as http://web:8000. Every update and `make up` recreate it after celery, as they do the Tailscale sidecar.
  scanner:
    image: "${CVENGINE_SCANNER_IMAGE:-${CVENGINE_SCANNER_ROLLBACK_IMAGE:-ghcr.io/hevnsnt/cvengine-sentinel:main}}"
    pull_policy: "${CVENGINE_SCANNER_PULL_POLICY:-missing}"
    restart: unless-stopped
    init: true
    network_mode: "service:celery"
    stop_grace_period: 75s
    pids_limit: 512
    # 3 GB. The scanner weighs every kind of work against this limit and never starts one that would not fit (the Sentinel's client/admission.py: one nuclei run
    # measured 500-730 MB, the screenshot browser 224+ MB, nmap 70 MB), so a lower limit makes it run fewer things at once, not die. 2 GB is enough to run two
    # nuclei and a browser together; 3 GB runs three nuclei and a browser at once, the mix that was once killed at 2 GB. Lower it on a small host (docs/DEPLOYMENT.md, Memory).
    mem_limit: "${SCANNER_MEM_LIMIT:-3g}"
    # The same reduced set as the Sentinel's own compose file (SN-8): every capability dropped, then NET_RAW (nmap's SYN scan, OS detection and UDP sweep,
    # naabu's SYN scan, which reach the unprivileged daemon's tools through file capabilities on nmap and naabu alone) and SYS_CHROOT (Chromium's sandbox).
    # NET_ADMIN is gone: in this container's shared network namespace (celery's, the host's with the hostnet overlay) it would let a compromised tool change
    # the routes, firewall and interfaces. The third entry is empty in effect (it repeats SYS_CHROOT) unless scripts/scanner.sh finds an image from before the
    # reduction: its nmap and naabu carry `cap_net_raw,cap_net_admin+eip`, and the kernel refuses to start a binary whose file capabilities it cannot grant
    # (execve fails with EPERM), so the script writes CVENGINE_SCANNER_EXTRA_CAP=NET_ADMIN for exactly such an image and removes it again for a newer one
    # (docs/BUILTIN-SCANNER.md, "Capabilities"). Not set here: read_only (bbot's discovery needs a writable ~/.bbot/tools) and no-new-privileges (it makes the
    # kernel ignore file capabilities, so raw sockets would depend on the container engine's version).
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - SYS_CHROOT
      - "${CVENGINE_SCANNER_EXTRA_CAP:-SYS_CHROOT}"
    # Chromium's sandbox for the web screenshots (kind web_screenshot, docs/PIPELINE.md, "Web screenshots") needs user namespaces, which Docker's default
    # seccomp profile refuses. This is Playwright's own profile for running Chromium with its sandbox in Docker (Docker's default plus clone, setns and
    # unshare), vendored unchanged from microsoft/playwright v1.64.1 (see THIRD-PARTY.md). The browser runs in this container and nowhere else; without
    # the profile the scanner's sandbox proof fails and it takes no picture, with the reason shown. `make up` and the update scripts recreate this
    # container, so an upgrade applies it with no manual step.
    # On a host whose AppArmor refuses user namespaces (Ubuntu 24.04+, recent Debian and Kali) the browser still cannot start: load
    # config/apparmor/cvengine-scanner (`sudo apparmor_parser -r -W config/apparmor/cvengine-scanner`) and use docker-compose.apparmor.yml (or
    # uncomment the line below, which edits a tracked file the updater then refuses to fast-forward over). `apparmor=unconfined` also works but removes the container's AppArmor confinement altogether. docs/DEPLOYMENT.md,
    # "Screenshots and AppArmor".
    security_opt:
      - seccomp=./config/seccomp/playwright-chromium.json
      # - apparmor=cvengine-scanner
    healthcheck:
      # Healthy while its heartbeats reach the server (python3 -m client.control health); it also restarts itself after three minutes without one.
      test: ["CMD", "python3", "-m", "client.control", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m  # covers the wait for the server's enrollment on a first start
    environment:
      CVENGINE_SENTINEL_BUILTIN: "1"
      CVENGINE_SENTINEL_BLOB_FILE: /bootstrap/blob  # the enrollment the server writes (agentapi/builtin_scanner.py); read again whenever it re-enrols
      CVENGINE_SENTINEL_ALLOW_INSECURE: "1"  # it talks to the server over the compose network, in plain http
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-},web,localhost,127.0.0.1"  # the server is never reached through a host proxy
    volumes:
      - scanner_bootstrap:/bootstrap:ro
      - scanner_state:/var/lib/cvengine-sentinel
    depends_on:
      - celery
      - web

  # The AI reviewer (docs/AI-REVIEWER.md): reviews every open finding once and checks the server's operations a few times a day, with the
  # provider and models chosen in Settings > AI model. It is boxed in on purpose: its own small image (./reviewer) with no cvENGINE source,
  # no database or Redis credentials, a read-only filesystem, no capabilities, an unprivileged user. It talks to the server only over
  # /api/v1/reviewer/* with a reviewer-scope token the server writes to reviewer_bootstrap, and to the AI provider. It idles until an AI
  # provider is configured; CVENGINE_REVIEWER=0 in .env turns it off.
  reviewer:
    build:
      context: ./reviewer
    image: cvengine-reviewer-local:latest
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "10002:10002"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: "${REVIEWER_MEM_LIMIT:-256m}"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # a local model server (LM Studio, Ollama, vLLM) on this machine, as Settings > AI model allows
    environment:
      CVENGINE_REVIEWER_SERVER: "http://web:8000"
      CVENGINE_REVIEWER_TOKEN_FILE: "/bootstrap/token"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-web,localhost,127.0.0.1}"
    volumes:
      - reviewer_bootstrap:/bootstrap:ro
    depends_on:
      - web
    networks:
      - rengine_network

  # Optional: OpenVAS (Greenbone Community Edition) as a vulnerability scanner. Off unless COMPOSE_PROFILES=openvas is in .env (or
  # `docker compose --profile openvas up -d`, `make openvas-up`); without it none of these services exist, start or use memory. docs/OPENVAS.md has
  # the hardware floor, the steps and what is not verified. This is the minimal set that exposes gvmd's GMP socket, taken from Greenbone's own
  # compose file for the community containers (greenbone.github.io/docs, "Greenbone Community Containers"): without the web interface (gsa, gsad,
  # nginx), the certificate generator and the gvm-tools shell. Only the celery container mounts gvmd's socket (read-only, see celery above); cvENGINE
  # talks GMP to it with python-gvm (cveFeed/openvas_scan.py). The scanner containers are on a network of their own, not rengine_network, and publish
  # no ports. Greenbone publishes no version tags, only the moving tags stable and community, so the program images are pinned by tag AND digest (to
  # update, pick the new digests as docs/OPENVAS.md describes), while the feed data images (the vulnerability tests, scap, cert and gvmd data) follow
  # their moving tag on purpose: they are data, refreshed daily and checked against Greenbone's GPG signing keys, and a pinned feed would be a stale one.
  # The first start downloads the feeds, which takes a long time and several GB of disk: no scan is possible until it ends (Settings > OpenVAS says so).
  openvas-vulnerability-tests:
    profiles: ["openvas"]
    restart: unless-stopped  # the feed containers refresh the vulnerability tests daily: without a policy they stay down after a host reboot
    image: "registry.community.greenbone.net/community/vulnerability-tests:community"
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - openvas_vt_data_vol:/mnt
    networks:
      - openvas_network

  openvas-notus-data:
    profiles: ["openvas"]
    restart: unless-stopped  # the feed containers refresh the vulnerability tests daily: without a policy they stay down after a host reboot
    image: "registry.community.greenbone.net/community/notus-data:community"
    environment:
      KEEP_ALIVE: 1
    volumes:
      - openvas_notus_data_vol:/mnt
    networks:
      - openvas_network

  openvas-scap-data:
    profiles: ["openvas"]
    restart: unless-stopped  # the feed containers refresh the vulnerability tests daily: without a policy they stay down after a host reboot
    image: "registry.community.greenbone.net/community/scap-data:community"
    environment:
      KEEP_ALIVE: 1
    volumes:
      - openvas_scap_data_vol:/mnt
    networks:
      - openvas_network

  openvas-cert-bund-data:
    profiles: ["openvas"]
    restart: unless-stopped  # the feed containers refresh the vulnerability tests daily: without a policy they stay down after a host reboot
    image: "registry.community.greenbone.net/community/cert-bund-data:community"
    environment:
      KEEP_ALIVE: 1
    volumes:
      - openvas_cert_data_vol:/mnt
    networks:
      - openvas_network

  openvas-dfn-cert-data:
    profiles: ["openvas"]
    restart: unless-stopped  # the feed containers refresh the vulnerability tests daily: without a policy they stay down after a host reboot
    image: "registry.community.greenbone.net/community/dfn-cert-data:community"
    environment:
      KEEP_ALIVE: 1
    volumes:
      - openvas_cert_data_vol:/mnt
    depends_on:
      openvas-cert-bund-data:
        condition: service_healthy
    networks:
      - openvas_network

  openvas-data-objects:
    profiles: ["openvas"]
    restart: unless-stopped  # the feed containers refresh the vulnerability tests daily: without a policy they stay down after a host reboot
    image: "registry.community.greenbone.net/community/data-objects:community"
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - openvas_data_objects_vol:/mnt
    networks:
      - openvas_network

  openvas-report-formats:
    profiles: ["openvas"]
    restart: unless-stopped  # the feed containers refresh the vulnerability tests daily: without a policy they stay down after a host reboot
    image: "registry.community.greenbone.net/community/report-formats:community"
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - openvas_data_objects_vol:/mnt
    depends_on:
      openvas-data-objects:
        condition: service_healthy
    networks:
      - openvas_network

  openvas-gpg-data:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/gpg-data:stable@sha256:c18618252f7d874cd1fe09413b043cfc40b57e6464d8c5973d4a93b074d5d91a"
    volumes:
      - openvas_gpg_data_vol:/mnt
    networks:
      - openvas_network

  openvas-redis:
    profiles: ["openvas"]
    restart: always
    image: "registry.community.greenbone.net/community/redis-server:stable@sha256:83227e34b276bf7c7453a91bbfc070341af58f7ff40eb707ed6724965fe3846c"
    volumes:
      - openvas_redis_socket_vol:/run/redis/
    networks:
      - openvas_network

  openvas-pg-gvm-migrator:
    profiles: ["openvas"]
    restart: "no"
    image: "registry.community.greenbone.net/community/pg-gvm-migrator:stable@sha256:8fc1cc11cac0481674527e01ec7610a8195110cf117d700bd47fe3af7012b34d"
    volumes:
      - openvas_psql_data_vol:/var/lib/postgresql
      - openvas_psql_socket_vol:/var/run/postgresql
    networks:
      - openvas_network

  openvas-pg-gvm:
    profiles: ["openvas"]
    restart: always
    image: "registry.community.greenbone.net/community/pg-gvm:stable@sha256:a18d9e2f0cbba7839e65547a2331ce8f984500e8c4fbe91d08f9a48036d03fa2"
    volumes:
      - openvas_psql_data_vol:/var/lib/postgresql
      - openvas_psql_socket_vol:/var/run/postgresql
    depends_on:
      openvas-pg-gvm-migrator:
        condition: service_completed_successfully
    networks:
      - openvas_network

  openvas-gvmd:
    profiles: ["openvas"]
    restart: always
    image: "registry.community.greenbone.net/community/gvmd:stable@sha256:e59a6a684b112ea77fe4ddd7e5ca35e6a07d36bf854f1b411d11d12f9b0c608a"
    volumes:
      - openvas_gvmd_data_vol:/var/lib/gvm
      - openvas_scap_data_vol:/var/lib/gvm/scap-data/
      - openvas_cert_data_vol:/var/lib/gvm/cert-data
      - openvas_data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - openvas_vt_data_vol:/var/lib/openvas/plugins
      - openvas_psql_data_vol:/var/lib/postgresql
      - openvas_gvmd_socket_vol:/run/gvmd
      - openvas_ospd_socket_vol:/run/ospd
      - openvas_psql_socket_vol:/var/run/postgresql
    depends_on:
      openvas-pg-gvm:
        condition: service_started
      openvas-scap-data:
        condition: service_healthy
      openvas-cert-bund-data:
        condition: service_healthy
      openvas-dfn-cert-data:
        condition: service_healthy
      openvas-data-objects:
        condition: service_healthy
      openvas-report-formats:
        condition: service_healthy
    networks:
      - openvas_network

  # writes the scanner's configuration (notus, and where openvasd listens) into a volume, then exits
  openvas-configure:
    profiles: ["openvas"]
    image: "registry.community.greenbone.net/community/openvas-scanner:stable@sha256:5b2043df8abed6acff7cd4c08636ea87c57f73b95cd406c88dc2adcec24426dd"
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log
    networks:
      - openvas_network

  # notus, the static vulnerability engine for authenticated package checks (OPENVASD_MODE service_notus: nothing else), reachable only by name inside the add-on's network
  openvas-openvasd:
    profiles: ["openvas"]
    restart: always
    image: "registry.community.greenbone.net/community/openvas-scanner:stable@sha256:5b2043df8abed6acff7cd4c08636ea87c57f73b95cd406c88dc2adcec24426dd"
    environment:
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - openvas_gpg_data_vol:/etc/openvas/gnupg
      - openvas_notus_data_vol:/var/lib/notus
    depends_on:
      openvas-vulnerability-tests:
        condition: service_healthy
      openvas-notus-data:
        condition: service_healthy
      openvas-configure:
        condition: service_completed_successfully
      openvas-gpg-data:
        condition: service_completed_successfully
    networks:
      openvas_network:
        aliases:
          - openvasd

  # the scanner itself. It needs raw sockets (NET_RAW, NET_ADMIN) and the unconfined seccomp and AppArmor profiles Greenbone's compose file uses, which is why
  # it is on its own network and why its scans leave by the Docker host's default route, never through the celery container (so no tailnet addresses: see docs/OPENVAS.md)
  openvas-ospd:
    profiles: ["openvas"]
    restart: always
    image: "registry.community.greenbone.net/community/ospd-openvas:stable@sha256:31a85272abc77521c98451ce6834ed7d2f887e98ff1b26ff3fd94f00d000b169"
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command: ["ospd-openvas", "-f", "--config", "/etc/gvm/ospd-openvas.conf", "--notus-feed-dir", "/var/lib/notus/advisories", "-m", "666"]
    volumes:
      - openvas_gpg_data_vol:/etc/openvas/gnupg
      - openvas_vt_data_vol:/var/lib/openvas/plugins
      - openvas_notus_data_vol:/var/lib/notus
      - openvas_ospd_socket_vol:/run/ospd
      - openvas_redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      openvas-redis:
        condition: service_started
      openvas-gpg-data:
        condition: service_completed_successfully
      openvas-configure:
        condition: service_completed_successfully
      openvas-vulnerability-tests:
        condition: service_healthy
      openvas-notus-data:
        condition: service_healthy
    networks:
      - openvas_network

