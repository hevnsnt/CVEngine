<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{% block title %}cvENGINE{% endblock %}</title>
<style>
  body{margin:0;padding:0;background:#f4f4f5;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
  a{color:#0a0a0b}
  table{border-collapse:collapse}
  @media (max-width:620px){
    .wrap{padding:16px 10px!important}.card{padding:24px 18px!important}.btn a{display:block!important}
    .stack>tbody>tr>td,.stack>tr>td{display:block!important;width:100%!important;box-sizing:border-box}
    .tile{margin-bottom:10px!important}
  }
  @media (prefers-color-scheme:dark){
    body,.page{background:#0d0e10!important}
    .card{background:#17181b!important;border-color:#2a2c31!important}
    .ink{color:#f2f2f4!important}.soft{color:#a4a4ad!important}
    .tile,.box,.threat{background:#0d0e10!important;border-color:#2a2c31!important}
    .rule{border-color:#2a2c31!important}
    .btn a{background:#ff5a00!important;color:#0a0a0b!important}
    a.plain{color:#f2f2f4!important}
    .good{color:#8fd0ab!important}.bad{color:#ff9a91!important}.warn{color:#f0c46c!important}
    .chip{border:1px solid #2a2c31!important}
  }
</style>
</head>
