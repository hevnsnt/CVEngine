<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Rebuilding cvENGINE</title>
    <script>
      // the same rule as the application (static/cve/theme.js): light unless the person chose dark, or auto and the system is dark
      (function () {
        var pref = "light";
        try {
          pref = localStorage.getItem("cve.theme") || "light";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "auto" &&
            window.matchMedia &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light",
        );
      })();
    </script>
    <style>
      /* One self-contained file: the application is the thing that is down, so nothing here is fetched from it or anywhere else. */
      :root {
        color-scheme: light;
        --bg: #f3f2ef;
        --card: #ffffff;
        --ink: #0d0d10;
        --muted: #5b5b63;
        --line: #e2e1dc;
        --brand: #ff5a00;
        --stage: #f7f6f2;
        --grid: rgba(13, 13, 16, 0.05);
        --grid-major: rgba(13, 13, 16, 0.08);
        --faint: rgba(13, 13, 16, 0.16);
        --plan: #1d3f73;
        --plan-deep: #16325c;
        --plan-line: #d7e5ff;
        --plan-soft: rgba(215, 229, 255, 0.35);
        --wood: #3a3a40;
        --wood-hi: #4b4b52;
        --navy: #262b3a;
        --navy-hi: #343a4d;
        --slate: #5d6779;
        --slate-hi: #6f7a8e;
        --vest: #ff6a14;
        --reflect: #e9edf3;
        --skin-a: #f0c8a4;
        --skin-a-sh: #dcae86;
        --skin-b: #a8714a;
        --skin-b-sh: #8f5d3b;
        --hair: #2a211c;
        --hat: #ff5a00;
        --hat-hi: #ff8b4d;
        --hat-sh: #d94b00;
        --hat-b: #f4f4f2;
        --hat-b-sh: #d9d9d4;
        --shoe: #16161a;
        --shadow: rgba(13, 13, 16, 0.12);
        --steel: #9aa0ab;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0b0b0d;
        --card: #141417;
        --ink: #f3f3f5;
        --muted: #a3a3ab;
        --line: #26262c;
        --stage: #101013;
        --grid: rgba(243, 243, 245, 0.04);
        --grid-major: rgba(243, 243, 245, 0.07);
        --faint: rgba(243, 243, 245, 0.14);
        --plan: #1b3a6a;
        --plan-deep: #142d54;
        --wood: #2b2b31;
        --wood-hi: #3a3a41;
        --navy: #2c3244;
        --navy-hi: #3b4258;
        --slate: #4f586a;
        --slate-hi: #616b7f;
        --shoe: #050507;
        --shadow: rgba(0, 0, 0, 0.45);
        --steel: #6d727c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.55 Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: relative;
        width: 100%;
        max-width: 880px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 24px 60px -28px rgba(0, 0, 0, 0.25);
      }
      main::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--brand),
          #ffb27a 55%,
          transparent
        );
      }
      .head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 18px;
        align-items: end;
        padding: 30px 34px 22px;
      }
      .brand {
        font:
          800 13px/1 ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .brand b {
        color: var(--brand);
      }
      h1 {
        margin: 12px 0 10px;
        font-size: clamp(28px, 4.6vw, 42px);
        line-height: 1.05;
        letter-spacing: -0.035em;
        font-weight: 800;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 54ch;
      }
      .eta {
        text-align: right;
        font:
          600 11px/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }
      .eta b {
        display: block;
        font:
          800 22px/1.1 Inter,
          system-ui,
          sans-serif;
        letter-spacing: -0.03em;
        text-transform: none;
        color: var(--ink);
      }
      .stage {
        position: relative;
        margin: 0 18px;
        border-radius: 12px;
        background-color: var(--stage);
        background-image:
          linear-gradient(var(--grid-major) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size:
          100px 100px,
          100px 100px,
          20px 20px,
          20px 20px;
        background-position: -1px -1px;
        border: 1px solid var(--line);
        overflow: hidden;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 34px 24px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
        font-size: 14px;
        color: var(--muted);
      }
      .pulse {
        position: relative;
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--brand);
      }
      .pulse::after {
        content: "";
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 2px solid var(--brand);
        opacity: 0;
        animation: ring 2s ease-out infinite;
      }
      .track {
        flex: 0 0 160px;
        height: 4px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
      }
      .track i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: var(--brand);
        animation: slide 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes ring {
        0% {
          transform: scale(0.6);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.6);
          opacity: 0;
        }
      }
      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      /* the scene */
      .faint {
        fill: none;
        stroke: var(--faint);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .plan-line {
        fill: none;
        stroke: var(--plan-line);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .draw {
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: draw 7s ease-in-out infinite;
      }
      .draw.d2 {
        animation-delay: 0.9s;
      }
      .draw.d3 {
        animation-delay: 1.8s;
      }
      .draw.d4 {
        animation-delay: 2.7s;
      }
      @keyframes draw {
        0% {
          stroke-dashoffset: 260;
        }
        35%,
        80% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -260;
        }
      }
      .node {
        fill: var(--plan-line);
        animation: glow 3.5s ease-in-out infinite;
      }
      .node.n2 {
        animation-delay: 1.2s;
      }
      .node.n3 {
        animation-delay: 2.4s;
      }
      @keyframes glow {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
      .pencil {
        animation: sketch 3.2s ease-in-out infinite;
      }
      @keyframes sketch {
        0%,
        100% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(7px, -3px);
        }
        50% {
          transform: translate(14px, 1px);
        }
        75% {
          transform: translate(6px, 3px);
        }
      }
      .point {
        transform-origin: 624px 184px;
        animation: point 4.5s ease-in-out infinite;
      }
      @keyframes point {
        0%,
        100% {
          transform: rotate(0deg);
        }
        45%,
        60% {
          transform: rotate(5deg);
        }
      }
      .nod {
        transform-origin: 643px 162px;
        animation: nod 4.5s ease-in-out infinite;
      }
      @keyframes nod {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-3deg);
        }
      }
      .look {
        transform-origin: 171px 162px;
        animation: look 6s ease-in-out infinite;
      }
      @keyframes look {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(2.5deg);
        }
      }
      .blink {
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 5s infinite;
      }
      .blink.b2 {
        animation-delay: 1.7s;
      }
      @keyframes blink {
        0%,
        94%,
        100% {
          transform: scaleY(1);
        }
        96% {
          transform: scaleY(0.1);
        }
      }
      .load {
        transform-origin: 668px 46px;
        animation: swing 6s ease-in-out infinite;
      }
      @keyframes swing {
        0%,
        100% {
          transform: rotate(1.6deg);
        }
        50% {
          transform: rotate(-1.6deg);
        }
      }
      .rise {
        animation: rise 6s ease-in-out infinite;
      }
      @keyframes rise {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      .beacon {
        fill: var(--brand);
        animation: glow 1.6s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
        }
        .draw {
          stroke-dashoffset: 0;
        }
      }
      @media (max-width: 620px) {
        .head {
          grid-template-columns: 1fr;
          padding: 24px 20px 18px;
        }
        .eta {
          text-align: left;
        }
        .stage {
          margin: 0 10px;
        }
        .foot {
          flex-direction: column;
          align-items: stretch;
          padding: 16px 20px 20px;
        }
        .track {
          flex: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="head">
        <div>
          <div class="brand"><b>cv</b>ENGINE</div>
          <h1>We are rebuilding cvENGINE.</h1>
          <p>
            A new version is going in right now. This page comes back by itself
            the moment the site answers, and scans pick up where they left off.
          </p>
        </div>
        <div class="eta">Usually<b>2 to 5 min</b></div>
      </div>

      <div class="stage">
        <svg

        >

            </linearGradient>
            <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0.14" />
              <stop offset="0.5" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <pattern

              width="12"
              height="12"
              patternUnits="userSpaceOnUse"
            >
              <path
                d="M12 0H0V12"
                fill="none"
                stroke="var(--plan-soft)"
                stroke-width="0.5"
              />
            </pattern>
          </defs>

          <!-- the build behind: scaffolding around the frame of what is going up, and a tower crane lifting the next piece -->
          <g class="faint">
            <path d="M330 300V118M392 300V118M454 300V118M516 300V118" />

              d="M318 300H528M318 250H528M318 200H528M318 150H528M318 118H528"
            />
            <path

          <rect x="14" y="52" width="22" height="14" rx="2" fill="var(--faint)" />

            </g>
          </g>

          <!-- ground and shadows -->
          <path

            stroke="var(--faint)"
            stroke-width="1.5"
            stroke-linecap="round"
          />
          <ellipse cx="400" cy="304" rx="165" ry="7" fill="var(--shadow)" />

          <!-- drafting table: legs, then the tilted board with the blueprint pinned to it -->

            <!-- the drawing: a service wiring diagram that keeps drawing itself in -->
            <rect

              rx="3"
            />

            />
            <rect

            <path

            <circle class="node" cx="90" cy="45" r="2.6" />

            <!-- title block -->

            <text

              font-size="6"
              letter-spacing="1"
            >
              CVENGINE
            </text>
            <text
              x="238"
              y="124"
              fill="var(--plan-line)"
              font-family="ui-monospace, Menlo, monospace"
              font-size="6"
              letter-spacing="0.5"
              opacity="0.8"

              REV NEXT
            </text>
            <rect
              x="7"

              height="132"

            />
            <circle cx="16" cy="16" r="2.4" fill="var(--brand)" />

          </g>
          <!-- pencil tray -->

          <rect

          <!-- engineer on the left: drafting, pencil to the plan -->

          <!-- engineer on the right: hi-vis vest, tablet in hand, pointing at the plan -->

            <path
              d="M630 236L622 296"
              stroke="var(--slate)"

            />
            <path
              d="M652 236L660 296"

              stroke-width="15"
              stroke-linecap="round"
            />
            <path

    <script>
      // Alone (nginx answers every path with this page, status 503, while an update is applied): a request for the same address tells us
      // when the real site is back; anything that is not a 5xx, a redirect to the sign-in page included, means reload.
      // Framed (any page of the application covers itself with this one when the site stops answering, static/cve/sitewatch.js, and an
      // administrator's page does so for the whole update, static/cve/updatebar.js): that page knows when the site is back and returns by
      // itself, so this one only shows the status line it is sent.
      (function () {
        var state = document.getElementById("state");
        if (window.top !== window) {
          window.addEventListener("message", function (e) {
            if (
              e.origin === location.origin &&
              e.data &&
              typeof e.data.state === "string"
            )
              state.textContent = e.data.state;
          });
          return;
        }
        var wait = 4000;
        function check() {
          fetch(location.pathname + "?up=" + Date.now(), {
            cache: "no-store",
            redirect: "manual",
            credentials: "same-origin",
          })
            .then(function (res) {
              if (res.type === "opaqueredirect" || res.status < 500) {
                state.textContent = "Back. Reloading.";
                location.reload();
                return;
              }
              again();
            })
            .catch(again);
        }
        function again() {
          wait = Math.min(wait + 1000, 10000);
          setTimeout(check, wait);
        }
        setTimeout(check, wait);
      })();
    </script>
