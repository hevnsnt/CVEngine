# The built-in scan engines, kept as labels (a scan records which one it was started with). Every scan runs the same fixed pipeline: the
# reNgine engine configurations these rows held are gone. load_default_fixtures adds a missing row and never changes an existing one.
- model: scanEngine.enginetype
  pk: 1
  fields:
    engine_name: Full Scan
    yaml_configuration: '# a label only: every scan runs the same fixed pipeline (the reNgine engine settings this held are gone)

