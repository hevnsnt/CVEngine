# Hosted mode (hosted/README.md): the overlay a cvENGINE hosted server runs with. Never used by a normal installation: nothing refers to this file
# until .env names it (CVENGINE_COMPOSE_FILES=docker-compose.yml,docker-compose.hosted.yml, which hosted/cvl-firstboot.sh writes), and the updater,
# the watchdog and the certificate renewal then use it too.
#
#   docker compose -f docker-compose.yml -f docker-compose.hosted.yml up -d
#
# What it changes:
#  * the database and the scan results live on the data volume, mounted at /mnt/cvl-data (the directories are made by hosted/cvl-firstboot.sh), so the
#    volume can be snapshotted, detached and moved apart from the server;
#  * the proxy gets the generated edge-secret file (hosted/gen-edge-auth.sh) in place of the stock empty one: with entries in it the proxy answers
#    403 to every request that lacks the Cloudflare Worker's secret and believes the client address the Worker sends (config/nginx/rengine.conf);
#  * the only published port is 443, on every address (the Worker connects to it from the Internet; the cloud firewall limits who may): the
#    database's and the web service's loopback ports, and the redirect listener on 8082, are not published at all;
#  * every long-running service restarts after a crash or a reboot;
#  * single sign-on (hosted/README.md, "Single sign-on"; OFF unless .env turns it on): the web service gets the public keys the site signs assertions
#    with, read-only at /etc/cvl/sso-keys.json (hosted/cvl-set-sso-keys.sh writes the host file; hosted/cvl-firstboot.sh makes a stock empty one so the
#    mount works before the first key push), and the CVENGINE_SSO* settings listed below. The settings are passed through only when .env defines
#    them: there is no default here, so nothing is enabled and nothing is set to an empty string by this file.
#
# docker-compose.yml's other services are untouched. Needs Compose 2.24 or newer (the !override and !reset tags), as install.sh already requires.
#
# Docker's userland proxy: with it on (Docker's default) an outside client can reach the proxy container as the bridge's gateway address, which is not
# a real client address. Nothing here depends on the peer address (the client address comes from the edge secret's header), but turn it off
# anyway on a hosted server, so the cloud firewall and nginx see real peers:  /etc/docker/daemon.json  {"userland-proxy": false}  then restart Docker.
# hosted/cvl-firstboot.sh warns when that is not set. The golden image sets it (hosted/README.md).
services:
  db:
    restart: always
    ports: !reset []
  redis:
    restart: always
  celery:
    restart: always
  celery-beat:
    restart: always
  web:
    restart: always
    ports: !reset []
    environment:  # a bare name is passed from .env when it is set there, and not passed at all otherwise
      - CVENGINE_SSO
      - CVENGINE_SSO_ENFORCE
      - CVENGINE_SSO_ISSUER
      - CVENGINE_SSO_AUDIENCE
      - CVENGINE_SSO_MAX_AUTH_AGE
      - CVENGINE_SSO_STEPUP_AGE
      - CVENGINE_SSO_BREAKGLASS_UNTIL
    volumes:
      - ${CVL_SSO_KEYS_FILE:-/etc/cvl/sso-keys.json}:/etc/cvl/sso-keys.json:ro  # a single file, written in place by hosted/cvl-set-sso-keys.sh so the mount follows
  proxy:
    restart: always
    ports: !override
      - "${CVENGINE_HTTPS_PORT:-443}:443/tcp"
    volumes:
      - ${CVL_EDGE_AUTH_CONF:-/etc/cvl/edge-auth.conf}:/etc/nginx/edge-auth.conf:ro  # replaces the stock file's mount at the same path

volumes:
  postgres18_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CVL_DATA_DIR:-/mnt/cvl-data}/postgres
  scan_results:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CVL_DATA_DIR:-/mnt/cvl-data}/scan_results
