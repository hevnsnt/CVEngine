name: 🔭 Tools up to date for release

# Preparing a release (any level) means looking at every scanner tool: a pull request into master fails while a pinned tool is behind its
# newest release. Bump the pin in web/Dockerfile (or web/requirements.txt, docker-compose.yml, build-pr.yml) and rebuild, or, when a newer
# version was looked at and deliberately not taken, add the `tools-reviewed` label to the pull request and say why in its description.
on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every pinned tool is at its newest release, or the pull request is labelled tools-reviewed
        env:
          REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'tools-reviewed') }}
          GITHUB_TOKEN: ${{ github.token }}  # for api.github.com lookups: unauthenticated they are rate limited on shared runners
        run: |
          if python3 scripts/check_tool_versions.py --fail-if-behind; then
            exit 0
          fi
          if [ "$REVIEWED" = "true" ]; then
            echo "::warning::A tool is behind its newest release; the tools-reviewed label says that was looked at."
            exit 0
          fi
          echo "::error::A pinned tool is behind its newest release, a pin is missing or a newest version could not be read (table above). Bump the pin or fix the lookup, or label the pull request tools-reviewed after deciding not to."
          exit 1
