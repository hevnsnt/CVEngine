name: 🔒 Security checks and pull request image build

on:
  push:
    branches:
      - master
      - develop
      - 1.4-develop
  pull_request:
    branches:
      - master
      - develop
      - 1.4-develop
      - release/*
  schedule:
    # weekly rebuild without the layer cache, so the pinned tools and the runtime-fetched templates are re-fetched from scratch
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-tests:
    name: 🔒 Django security and tenancy tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cvengine_ci
          POSTGRES_USER: cvengine_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvengine_ci -d cvengine_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      POSTGRES_DB: cvengine_ci
      POSTGRES_USER: cvengine_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      CELERY_BROKER: redis://127.0.0.1:6379/0
      CELERY_BACKEND: redis://127.0.0.1:6379/0
      RENGINE_HOME: ${{ github.workspace }}/web
      DOMAIN_NAME: localhost
    steps:
      - name: Set cache directory
        run: printf 'XDG_CACHE_HOME=%s/cvengine-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Native rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install application dependencies
        run: |
          sed '/^psycopg2==/d' web/requirements.txt > "$RUNNER_TEMP/cvengine-ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/cvengine-ci-requirements.txt" psycopg2-binary==2.9.11 tblib==3.2.2  # tblib lets a failure in a parallel test worker show its real traceback
      - name: Nuclei positive and negative loopback fixture smoke
        working-directory: web
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/cvengine-nuclei-config
          XDG_CACHE_HOME: ${{ runner.temp }}/cvengine-nuclei-cache
        run: |
          nuclei_archive="$RUNNER_TEMP/nuclei_3.11.1_linux_amd64.zip"
          curl --fail --location --retry 2 --max-time 120 \
            --output "$nuclei_archive" \
            https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip
          printf '%s  %s\n' 'ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6' "$nuclei_archive" | sha256sum --check --status
          unzip -p "$nuclei_archive" nuclei > "$RUNNER_TEMP/cvengine-nuclei"
          chmod 700 "$RUNNER_TEMP/cvengine-nuclei"
          CVENGINE_NUCLEI_SMOKE_BIN="$RUNNER_TEMP/cvengine-nuclei" python tests/nuclei_fixture_smoke.py
      - name: No model change without its migration
        working-directory: web
        env:
          DEBUG: '0'
        # the celery container no longer writes migrations at start (it used to, into the host's checkout): a model change must carry its migration
        run: python manage.py makemigrations --check --dry-run
      - name: Django test suite
        working-directory: web
        env:
          DEBUG: '0'
        # one worker per core (at most 7: reNgine/test_runner.py gives each worker its own Redis databases)
        run: python manage.py test --noinput --parallel auto
      - name: Graph cluster regression gate
        run: node --test web/tests/test_graph_cluster.mjs web/tests/test_links.mjs web/tests/test_inventory_snippets.mjs web/tests/test_frontend_static.mjs web/tests/test_config_maxxing.mjs web/tests/test_config_maxxing_page.mjs

  build:
    name: 🐳 Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # each platform builds on a native runner; arm64 under QEMU took over 1.5 hours
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: 📥 Checkout the git repo
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📋 Bill of materials
        if: matrix.arch == 'amd64'
        run: python3 scripts/generate_sbom.py --output "$RUNNER_TEMP/cvengine.sbom.cdx.json"

      - name: 📋 Keep the bill of materials
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ runner.temp }}/cvengine.sbom.cdx.json
          retention-days: 30

      - name: 🏷️ Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hevnsnt/cvengine
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      # Pull requests can read the layer cache of master but not of other pull requests, so master
      # and the weekly run write it (one scope per platform) and pull requests only read it.
      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: web/
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=image-{0}', matrix.arch) || '' }}
