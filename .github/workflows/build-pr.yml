name: 🔒 Security checks and pull request image build

on:
  push:
    branches:
      - master
  pull_request:
    branches: 
      - master
      - release/*

jobs:
  security-tests:
    name: 🔒 Django security and tenancy tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cvengine_ci
          POSTGRES_USER: cvengine_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvengine_ci -d cvengine_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      POSTGRES_DB: cvengine_ci
      POSTGRES_USER: cvengine_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      CELERY_BROKER: redis://127.0.0.1:6379/0
      CELERY_BACKEND: redis://127.0.0.1:6379/0
      RENGINE_HOME: ${{ github.workspace }}/web
      DOMAIN_NAME: localhost
    steps:
      - name: Set cache directory
        run: printf 'XDG_CACHE_HOME=%s/cvengine-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Native rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install application dependencies
        run: |
          sed '/^psycopg2==/d' web/requirements.txt > "$RUNNER_TEMP/cvengine-ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/cvengine-ci-requirements.txt" psycopg2-binary==2.9.11
      - name: Nuclei positive and negative loopback fixture smoke
        working-directory: web
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/cvengine-nuclei-config
          XDG_CACHE_HOME: ${{ runner.temp }}/cvengine-nuclei-cache
        run: |
          nuclei_archive="$RUNNER_TEMP/nuclei_3.11.1_linux_amd64.zip"
          curl --fail --location --retry 2 --max-time 120 \
            --output "$nuclei_archive" \
            https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip
          printf '%s  %s\n' 'ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6' "$nuclei_archive" | sha256sum --check --status
          unzip -p "$nuclei_archive" nuclei > "$RUNNER_TEMP/cvengine-nuclei"
          chmod 700 "$RUNNER_TEMP/cvengine-nuclei"
          CVENGINE_NUCLEI_SMOKE_BIN="$RUNNER_TEMP/cvengine-nuclei" python tests/nuclei_fixture_smoke.py
      - name: Django security and tenancy regression gate
        working-directory: web
        run: >-
          python manage.py test
          tests.test_host_headers tests.test_tenancy tests.test_scope_api
          tests.test_agentapi tests.test_validation tests.test_hard_security
          tests.test_legacy_cms_security tests.test_graph_overview
          tests.test_template_fixtures tests.test_counts
          tests.test_bounty_data tests.test_bounty_scope tests.test_bounty_report
          tests.test_bounty_api tests.test_bounty_workbench --noinput
      - name: Graph cluster regression gate
        run: node --test web/tests/test_graph_cluster.mjs web/tests/test_links.mjs

  build:
    name: 🐳 Build Docker image
    if: github.event_name == 'pull_request'
    needs: security-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          # - linux/arm/v7
    steps:
      - name: 📥 Checkout the git repo
        uses: actions/checkout@v4

      - name: 🖥️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hevnsnt/cvengine
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: web/
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
