name: 🔒 Security checks and pull request image build

on:
  # develop is not listed: a pull request is tested merged with develop before it lands, and the push run after the merge repeated all of it
  push:
    branches:
      - master
      - 1.4-develop
  pull_request:
    branches:
      - master
      - develop
      - 1.4-develop
      - release/*
  schedule:
    # weekly rebuild without the layer cache, so the pinned tools and the runtime-fetched templates are re-fetched from scratch
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # What the pull request touches decides which of the heavy jobs run (a documentation or test only change builds no image and opens no browser).
    # The Django tests always run: they also check the documentation and the changelog.
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.diff.outputs.runtime }}
      image_inputs: ${{ steps.diff.outputs.image_inputs }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # no later step pushes with git, so the token is not left in .git/config
          fetch-depth: 0
      - name: Which kinds of file changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"; echo "image_inputs=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "$files"
          # runtime: anything that is not documentation, the changelog or a test (the application, the images, the scripts, the workflows)
          if echo "$files" | grep -qvE '^(docs/|web/tests/|CHANGELOG\.md$)|\.md$'; then runtime=true; else runtime=false; fi
          # image_inputs: what decides whether the arm64 image still builds (the Dockerfiles, the pinned requirements, the compose files, the workflows)
          if echo "$files" | grep -qE '^(web/Dockerfile|web/requirements|reviewer/|config/|docker-compose|\.github/)'; then inputs=true; else inputs=false; fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"; echo "image_inputs=$inputs" >> "$GITHUB_OUTPUT"

  security-tests:
    name: 🔒 Django security and tenancy tests (${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # the suite is split in four jobs that take about the same time (scripts/ci_shard.py, weighed by scripts/ci_shard_weights.json): each has its own Postgres
    # and Redis, so they never share state
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cvengine_ci
          POSTGRES_USER: cvengine_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvengine_ci -d cvengine_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      POSTGRES_DB: cvengine_ci
      POSTGRES_USER: cvengine_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      CELERY_BROKER: redis://127.0.0.1:6379/0
      CELERY_BACKEND: redis://127.0.0.1:6379/0
      CVENGINE_HOME: ${{ github.workspace }}/web
      DOMAIN_NAME: localhost
    steps:
      - name: Set cache directory
        run: printf 'XDG_CACHE_HOME=%s/cvengine-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # no later step pushes with git, so the token is not left in .git/config
      - name: Resolver fallback (only when the runner cannot find the Ubuntu package servers)
        uses: ./.github/actions/resolver-fallback
        with:
          docker: "false"  # this job has service containers (Postgres, Redis): a Docker restart would stop them
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Native rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: The proxy's own nginx image (web/tests/test_tunnel_client_address.py runs config/nginx/cvengine.conf in it and fails when it cannot)
        run: docker pull nginx:alpine
      - name: Install application dependencies
        run: |
          sed '/^psycopg2==/d' web/requirements.txt > "$RUNNER_TEMP/cvengine-ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/cvengine-ci-requirements.txt" psycopg2-binary==2.9.11 tblib==3.2.2 jsonschema==4.26.0  # jsonschema checks the Sentinel result contract (cvengine_scanner/contract/sentinel_contract.json, from the installed scanner library) in the tests; tblib lets a failure in a parallel test worker show its real traceback
      - name: No model change without its migration
        if: matrix.shard == 1
        working-directory: web
        env:
          DEBUG: '0'
        # the celery container no longer writes migrations at start (it used to, into the host's checkout): a model change must carry its migration
        run: python manage.py makemigrations --check --dry-run
      - name: No migration number used twice
        if: matrix.shard == 1
        # makemigrations --check passes when the second file depends on the first (one leaf); two files with one number still leave the run order unclear
        run: python scripts/check_migrations.py
      - name: Pinned Kingfisher rule bundle (secret validation allow-list)
        # tests/test_secrets_validation.py recomputes the hash of every allow-listed validator from the rule bundle the Sentinel image pins: the
        # attested release asset, checked against the sha256 in web/cveFeed/data/secrets_validation_allowlist.json (docs/SECRETS-PLAN.md 5.2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c "import json; print(json.load(open('web/cveFeed/data/secrets_validation_allowlist.json'))['kingfisher_version'])")
          pinned=$(python -c "import json; print(json.load(open('web/cveFeed/data/secrets_validation_allowlist.json'))['rule_bundle_sha256'])")
          dir="$RUNNER_TEMP/kingfisher-rules"
          mkdir -p "$dir"
          cd "$dir"
          gh release download "v$version" --repo mongodb/kingfisher --pattern kingfisher-rule-bundle.tgz --pattern multiple.intoto.jsonl
          gh attestation verify kingfisher-rule-bundle.tgz --repo mongodb/kingfisher \
            --signer-workflow mongodb/kingfisher/.github/workflows/release.yml --source-ref "refs/tags/v$version" --bundle multiple.intoto.jsonl
          printf '%s  %s\n' "$pinned" kingfisher-rule-bundle.tgz | sha256sum --check --status
          tar xzf kingfisher-rule-bundle.tgz
          printf 'CVENGINE_KINGFISHER_RULES=%s\n' "$dir/generated/rules" >> "$GITHUB_ENV"
      - name: Sentinel image pins (the About page lists every tool they hold)
        # tests/test_about_page.py reads the Sentinel repository's Dockerfile and requirements.txt at the commit web/requirements.txt pins and fails when a tool
        # pinned there is missing from the About page or listed at another version
        run: |
          set -euo pipefail
          sha=$(sed -n 's/.*cvENGINE-sentinel@\([0-9a-f]\{40\}\).*/\1/p' web/requirements.txt | head -1)
          dir="$RUNNER_TEMP/sentinel-files"
          mkdir -p "$dir"
          for f in Dockerfile requirements.txt; do
            curl -fsSL "https://raw.githubusercontent.com/hevnsnt/cvENGINE-sentinel/$sha/$f" -o "$dir/$f"
          done
          printf 'CVENGINE_SENTINEL_FILES=%s\nCVENGINE_REQUIRE_SENTINEL_FILES=1\n' "$dir" >> "$GITHUB_ENV"
      - name: Scanner lock (the built-in scanner and the server library run the pinned Sentinel commit)
        # scripts/scanner_lock.py check: docker-compose.yml's default scanner image is the digest the lock pins, web/requirements.txt installs the library
        # from the same commit, the contract version is not above what this server reads, and (--remote) the commit is on the Sentinel repository's main
        # branch and the registry's sha-<12> tag of it names the pinned digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/scanner_lock.py check --remote
      - name: Base images pinned by digest
        # scripts/image_pins.py check: every stock image of the Dockerfiles and compose files (ubuntu, uv, python, postgres, redis, nginx) carries a digest,
        # one digest per image:tag (offline; the weekly tool-releases job reports pins whose tag moved since)
        run: python3 scripts/image_pins.py check
      - name: Django test suite
        working-directory: web
        env:
          DEBUG: '0'
          CVENGINE_TEST_BLOCK_NETWORK: '1'  # a test that resolves a name or connects outside loopback, Postgres and Redis fails (cvengine/test_runner.py)
        # one worker per core (at most 7: cvengine/test_runner.py gives each worker its own Redis databases)
        run: python manage.py test --noinput --parallel auto $(python ../scripts/ci_shard.py ${{ matrix.shard }} 4) --durations 15 --module-times
      - name: Front-end node tests (every file in web/tests)
        # was a hand-kept list of 29 files that left 19 of the 50 out (retest, Situations, list failure states, nav fold, ...): a new test file now runs without anyone adding it here
        if: matrix.shard == 1
        run: node --test web/tests/*.mjs


  ui-gates:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: 🖥️ UI gates (headless Chromium on the seeded demo)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cvengine_ci
          POSTGRES_USER: cvengine_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvengine_ci -d cvengine_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      POSTGRES_DB: cvengine_ci
      POSTGRES_USER: cvengine_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      CELERY_BROKER: redis://127.0.0.1:6379/0
      CELERY_BACKEND: redis://127.0.0.1:6379/0
      CACHE_URL: redis://127.0.0.1:6379/1
      CVENGINE_HOME: ${{ github.workspace }}/web
      DOMAIN_NAME: localhost
      DEBUG: '0'
    steps:
      - name: Set cache directory
        run: printf 'XDG_CACHE_HOME=%s/cvengine-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # no later step pushes with git, so the token is not left in .git/config
      - name: Resolver fallback (only when the runner cannot find the Ubuntu package servers)
        uses: ./.github/actions/resolver-fallback
        with:
          docker: "false"
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Native rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install application dependencies and the browser
        run: |
          sed '/^psycopg2==/d' web/requirements.txt > "$RUNNER_TEMP/cvengine-ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/cvengine-ci-requirements.txt" psycopg2-binary==2.9.11 tblib==3.2.2 jsonschema==4.26.0 playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Migrate
        working-directory: web
        run: python manage.py migrate --noinput
      - name: "UI gates (scripts/ci_ui_gates.sh: seed, start the app, run every ui_* gate)"
        run: scripts/ci_ui_gates.sh
      - name: Gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ui-gate-logs
          path: /tmp/ui-gates
          if-no-files-found: ignore

  build:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: 🐳 Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # each platform builds on a native runner; arm64 under QEMU took over 1.5 hours. A pull request builds arm64 only when something that decides it
        # changed (the Dockerfiles, the pinned requirements, the compose files, the workflows); pushes to master and the weekly run always build both.
        include: ${{ fromJSON(needs.changes.outputs.image_inputs == 'true' && '[{"platform":"linux/amd64","arch":"amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm"}]' || '[{"platform":"linux/amd64","arch":"amd64","runner":"ubuntu-latest"}]') }}
    steps:
      - name: 📥 Checkout the git repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # no later step pushes with git, so the token is not left in .git/config
      - name: Resolver fallback (only when the runner cannot find the Ubuntu package servers)
        uses: ./.github/actions/resolver-fallback

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: 📋 Bill of materials
        if: matrix.arch == 'amd64'
        run: python3 scripts/generate_sbom.py --output "$RUNNER_TEMP/cvengine.sbom.cdx.json"

      - name: 📋 Keep the bill of materials
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: ${{ runner.temp }}/cvengine.sbom.cdx.json
          retention-days: 30

      - name: 🏷️ Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: hevnsnt/cvengine
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      # Pull requests can read the layer cache of master but not of other pull requests, so master
      # and the weekly run write it (one scope per platform) and pull requests only read it.
      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: web/
          platforms: ${{ matrix.platform }}
          push: false
          load: true  # the next step runs it
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=image-{0}', matrix.arch) || '' }}

  reviewer-image:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    # The AI reviewer's own image (docs/AI-REVIEWER.md): it must build, run as its unprivileged user on a read-only filesystem with no
    # capabilities, import every module (the Anthropic SDK included) with the network off, and pass its unit tests there.
    name: 🤖 Build the AI reviewer image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout the git repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # no later step pushes with git, so the token is not left in .git/config
      - name: Resolver fallback (only when the runner cannot find the Ubuntu package servers)
        uses: ./.github/actions/resolver-fallback
      - name: 🏗️ Build the reviewer image
        run: docker build -t cvengine-reviewer-ci reviewer/
      - name: 🧪 Run it the way compose runs it
        run: |
          docker run --rm --read-only --tmpfs /tmp --user 10002:10002 --cap-drop ALL --security-opt no-new-privileges:true \
            --network none --entrypoint python3 cvengine-reviewer-ci -I -c \
            "import os, importlib.util, cvengine_reviewer.llm, cvengine_reviewer.jobs, cvengine_reviewer.server, cvengine_reviewer.__main__, anthropic; assert os.getuid() == 10002; assert importlib.util.find_spec('pip') is None, 'pip is in the image'; print('reviewer image ok', anthropic.__version__)"
      - name: 🧪 Run the reviewer package's unit tests inside the image
        # reviewer/tests (standard library only): the pipeline's request layer and the job loop, on the image's own Python, no network
        run: |
          docker run --rm --read-only --tmpfs /tmp --user 10002:10002 --cap-drop ALL --security-opt no-new-privileges:true \
            --network none -v "$PWD/reviewer/tests:/reviewer-tests:ro" --entrypoint python3 cvengine-reviewer-ci \
            -m unittest discover -s /reviewer-tests -v
