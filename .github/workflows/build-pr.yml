name: 🔒 Security checks and pull request image build

on:
  push:
    branches:
      - master
      - develop
      - 1.4-develop
  pull_request:
    branches:
      - master
      - develop
      - 1.4-develop
      - release/*
  schedule:
    # weekly rebuild without the layer cache, so the pinned tools and the runtime-fetched templates are re-fetched from scratch
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-tests:
    name: 🔒 Django security and tenancy tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cvengine_ci
          POSTGRES_USER: cvengine_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvengine_ci -d cvengine_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      POSTGRES_DB: cvengine_ci
      POSTGRES_USER: cvengine_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      CELERY_BROKER: redis://127.0.0.1:6379/0
      CELERY_BACKEND: redis://127.0.0.1:6379/0
      RENGINE_HOME: ${{ github.workspace }}/web
      DOMAIN_NAME: localhost
    steps:
      - name: Set cache directory
        run: printf 'XDG_CACHE_HOME=%s/cvengine-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Native rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install application dependencies
        run: |
          sed '/^psycopg2==/d' web/requirements.txt > "$RUNNER_TEMP/cvengine-ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/cvengine-ci-requirements.txt" psycopg2-binary==2.9.11 tblib==3.2.2 jsonschema==4.26.0  # jsonschema checks the Sentinel result contract (cvengine_scanner/contract/sentinel_contract.json, from the installed scanner library) in the tests; tblib lets a failure in a parallel test worker show its real traceback
      - name: No model change without its migration
        working-directory: web
        env:
          DEBUG: '0'
        # the celery container no longer writes migrations at start (it used to, into the host's checkout): a model change must carry its migration
        run: python manage.py makemigrations --check --dry-run
      - name: No migration number used twice
        # makemigrations --check passes when the second file depends on the first (one leaf); two files with one number still leave the run order unclear
        run: python scripts/check_migrations.py
      - name: Pinned Kingfisher rule bundle (secret validation allow-list)
        # tests/test_secrets_validation.py recomputes the hash of every allow-listed validator from the rule bundle the Sentinel image pins: the
        # attested release asset, checked against the sha256 in web/cveFeed/data/secrets_validation_allowlist.json (docs/SECRETS-PLAN.md 5.2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c "import json; print(json.load(open('web/cveFeed/data/secrets_validation_allowlist.json'))['kingfisher_version'])")
          pinned=$(python -c "import json; print(json.load(open('web/cveFeed/data/secrets_validation_allowlist.json'))['rule_bundle_sha256'])")
          dir="$RUNNER_TEMP/kingfisher-rules"
          mkdir -p "$dir"
          cd "$dir"
          gh release download "v$version" --repo mongodb/kingfisher --pattern kingfisher-rule-bundle.tgz --pattern multiple.intoto.jsonl
          gh attestation verify kingfisher-rule-bundle.tgz --repo mongodb/kingfisher \
            --signer-workflow mongodb/kingfisher/.github/workflows/release.yml --source-ref "refs/tags/v$version" --bundle multiple.intoto.jsonl
          printf '%s  %s\n' "$pinned" kingfisher-rule-bundle.tgz | sha256sum --check --status
          tar xzf kingfisher-rule-bundle.tgz
          printf 'CVENGINE_KINGFISHER_RULES=%s\n' "$dir/generated/rules" >> "$GITHUB_ENV"
      - name: Sentinel image pins (the About page lists every tool they hold)
        # tests/test_about_page.py reads the Sentinel repository's Dockerfile and requirements.txt at the commit web/requirements.txt pins and fails when a tool
        # pinned there is missing from the About page or listed at another version
        run: |
          set -euo pipefail
          sha=$(sed -n 's/.*cvENGINE-sentinel@\([0-9a-f]\{40\}\).*/\1/p' web/requirements.txt | head -1)
          dir="$RUNNER_TEMP/sentinel-files"
          mkdir -p "$dir"
          for f in Dockerfile requirements.txt; do
            curl -fsSL "https://raw.githubusercontent.com/hevnsnt/cvENGINE-sentinel/$sha/$f" -o "$dir/$f"
          done
          printf 'CVENGINE_SENTINEL_FILES=%s\nCVENGINE_REQUIRE_SENTINEL_FILES=1\n' "$dir" >> "$GITHUB_ENV"
      - name: Scanner lock (the built-in scanner follows the newest Sentinel; the lock is its known-good floor)
        # scripts/scanner_lock.py check: docker-compose.yml's default scanner image is the moving tag the lock names (never a digest), the floor's contract
        # version is not above what this server reads, and (--remote) the floor commit exists on the Sentinel repository's main branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/scanner_lock.py check --remote
      - name: Django test suite
        working-directory: web
        env:
          DEBUG: '0'
          CVENGINE_TEST_BLOCK_NETWORK: '1'  # a test that resolves a name or connects outside loopback, Postgres and Redis fails (reNgine/test_runner.py)
        # one worker per core (at most 7: reNgine/test_runner.py gives each worker its own Redis databases)
        run: python manage.py test --noinput --parallel auto
      - name: Graph cluster regression gate
        run: node --test web/tests/test_graph_cluster.mjs web/tests/test_admin_legacy_logic.mjs web/tests/test_connect_card.mjs web/tests/test_links.mjs web/tests/test_inventory_snippets.mjs web/tests/test_frontend_static.mjs web/tests/test_poll.mjs web/tests/test_tile_loader.mjs web/tests/test_config_maxxing.mjs web/tests/test_config_maxxing_page.mjs web/tests/test_ai_settings_logic.mjs web/tests/test_tunables_card.mjs web/tests/test_autotune_card.mjs web/tests/test_sentinel_live.mjs web/tests/test_discover_mode_logic.mjs web/tests/test_finding_groups_logic.mjs web/tests/test_addtargets_logic.mjs web/tests/test_closure_logic.mjs web/tests/test_cve_explorer.mjs web/tests/test_score_detail.mjs web/tests/test_secret_detail.mjs web/tests/test_loadmore_logic.mjs web/tests/test_provision_form.mjs web/tests/test_seed_card.mjs web/tests/test_update_disk_screen.mjs web/tests/test_glance_logic.mjs web/tests/test_maintenance_status_page.mjs web/tests/test_keep_state.mjs web/tests/test_keep_state_contract.mjs

  build:
    name: 🐳 Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # each platform builds on a native runner; arm64 under QEMU took over 1.5 hours
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: 📥 Checkout the git repo
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📋 Bill of materials
        if: matrix.arch == 'amd64'
        run: python3 scripts/generate_sbom.py --output "$RUNNER_TEMP/cvengine.sbom.cdx.json"

      - name: 📋 Keep the bill of materials
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ runner.temp }}/cvengine.sbom.cdx.json
          retention-days: 30

      - name: 🏷️ Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hevnsnt/cvengine
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      # Pull requests can read the layer cache of master but not of other pull requests, so master
      # and the weekly run write it (one scope per platform) and pull requests only read it.
      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: web/
          platforms: ${{ matrix.platform }}
          push: false
          load: true  # the next step runs it
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=image-{0}', matrix.arch) || '' }}

  reviewer-image:
    # The AI reviewer's own image (docs/AI-REVIEWER.md): it must build, run as its unprivileged user on a read-only filesystem with no
    # capabilities, import every module (the Anthropic SDK included) with the network off, and pass its unit tests there.
    name: 🤖 Build the AI reviewer image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout the git repo
        uses: actions/checkout@v4
      - name: 🏗️ Build the reviewer image
        run: docker build -t cvengine-reviewer-ci reviewer/
      - name: 🧪 Run it the way compose runs it
        run: |
          docker run --rm --read-only --tmpfs /tmp --user 10002:10002 --cap-drop ALL --security-opt no-new-privileges:true \
            --network none --entrypoint python3 cvengine-reviewer-ci -I -c \
            "import os, cvengine_reviewer.llm, cvengine_reviewer.jobs, cvengine_reviewer.server, cvengine_reviewer.__main__, anthropic; assert os.getuid() == 10002; print('reviewer image ok', anthropic.__version__)"
      - name: 🧪 Run the reviewer package's unit tests inside the image
        # reviewer/tests (standard library only): the pipeline's request layer and the job loop, on the image's own Python, no network
        run: |
          docker run --rm --read-only --tmpfs /tmp --user 10002:10002 --cap-drop ALL --security-opt no-new-privileges:true \
            --network none -v "$PWD/reviewer/tests:/reviewer-tests:ro" --entrypoint python3 cvengine-reviewer-ci \
            -m unittest discover -s /reviewer-tests -v
