name: "Code Quality"

on:
  push:
    branches: [ master, 1.4-develop ]
  pull_request:
    branches: [ master, develop, 1.4-develop ]
    # documentation and tests hold no code to analyse
    paths-ignore:
      - 'docs/**'
      - 'web/tests/**'
      - '**.md'
  schedule:
    - cron: '0 18 * * 5'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        persist-credentials: false  # no later step pushes with git, so the token is not left in .git/config

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6  # v3.39.5
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6  # v3.39.5

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6  # v3.39.5
