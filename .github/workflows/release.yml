name: 🏷️ Release

# Two ways to cut a release:
#  - push a tag such as v1.0 (publishes a GitHub release from that version's CHANGELOG.md section; a patch such as v1.0.1 keeps the v1.0 notes and adds its own at the end), or
#  - run this workflow manually (Actions tab / workflow_dispatch): it creates the tag from master's web/.version
#    (or the tag you type) and then publishes. The manual path exists because a cloud session cannot push tags.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (default: the version in web/.version, e.g. v1.0)'
        required: false
        default: ''
      tools_reviewed:
        description: 'Release even though a pinned tool is behind its newest release (only after looking at the newer version)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 🏷️ Publish the GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔭 Every pinned tool is at its newest release
        env:
          REVIEWED: ${{ github.event.inputs.tools_reviewed }}
          GITHUB_TOKEN: ${{ github.token }}  # for api.github.com lookups: unauthenticated they are rate limited on shared runners
        run: |
          if python3 scripts/check_tool_versions.py --fail-if-behind; then
            exit 0
          fi
          if [ "$REVIEWED" = "true" ]; then
            echo "::warning::A tool is behind its newest release; this run says that was looked at."
            exit 0
          fi
          echo "::error::A pinned tool is behind its newest release (table above). Bump the pin, or run again with tools_reviewed after deciding not to."
          exit 1

      - name: 🏷️ Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version="v$(tr -d '[:space:]' < web/.version | sed 's/^v//')"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF_NAME" != "master" ]; then
              echo "::error::Releases are cut from master; this run is on '$REF_NAME'."
              exit 1
            fi
            tag="${INPUT_TAG:-$version}"
          else
            tag="$REF_NAME"
            # a pushed tag must point at a commit that is on master: the master-only rule above holds for manual runs, and a tag on a branch
            # commit whose web/.version matched would otherwise publish a "latest" release from it
            relation=$(gh api "repos/$REPO/compare/master...$SHA" --jq .status) || relation=unknown
            case "$relation" in
              identical|behind) ;;
              *) echo "::error::Tag $tag points at $SHA, which is not on master (compare status: $relation). Releases are cut from master."; exit 1 ;;
            esac
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::web/.version is '$version' but the tag is '$tag'. Bump web/.version or pass a matching tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Create the tag (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on the remote; publishing from it."
            # the notes, the archives and the bill of materials are built from the tag's own tree, not from master's tip, which may be ahead of it
            git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
            git checkout --quiet "refs/tags/$TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "CVEngine $TAG"
            git push origin "refs/tags/$TAG"
          fi
          # a tag that did not reach the remote must stop the run here, not later at "gh release create"
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null

      - name: 📝 Release notes from the changelog
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # A section is the text from "## <tag> (" up to the next "## " heading. A patch tag (v1.0.1) keeps its minor
          # release's notes (v1.0) and appends its own short section at the end. Links are made absolute at this tag.
          section() {
            awk -v tag="$1" '
              index($0, "## " tag " (") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          }
          base="$TAG"
          case "$TAG" in v*.*.[1-9]*) base="${TAG%.*}" ;; esac
          if [ "$base" != "$TAG" ]; then
            { section "$base"; echo; echo "## $TAG"; section "$TAG"; } > "$RUNNER_TEMP/raw.md"
            section "$TAG" | grep -q '[^[:space:]]' || : > "$RUNNER_TEMP/raw.md"
          else
            section "$TAG" > "$RUNNER_TEMP/raw.md"
          fi
          sed -E "s#\]\((docs/|[A-Z-]+\.md)#](https://github.com/$REPO/blob/$TAG/\1#g" "$RUNNER_TEMP/raw.md" > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no '## $TAG (' section"
            exit 1
          fi

      - name: 🚀 Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # a release may carry a name: a line "<!-- edition: camstork edition -->" in its own CHANGELOG section puts it in the title
          edition=$(awk -v tag="$TAG" 'index($0, "## " tag " (") == 1 { f = 1; next } f && /^## / { exit } f' CHANGELOG.md \
            | sed -n 's/^<!-- edition: \([A-Za-z0-9][A-Za-z0-9 .-]\{0,39\}\) -->$/\1/p' | head -n 1)
          title="CVEngine $TAG${edition:+, $edition}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --latest --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: 📦 Attach source archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The tree of the tag, without .git or any untracked file (so nothing from a working copy such as secrets/ or .env can
          # end up in it). A git checkout stays the supported way to install, because the updater works through git; these are
          # for reading, mirroring and offline transfer.
          mkdir -p "$RUNNER_TEMP/assets"
          git archive --format=zip    --prefix="cvengine-$TAG/" -o "$RUNNER_TEMP/assets/cvengine-$TAG.zip"    "refs/tags/$TAG"
          git archive --format=tar.gz --prefix="cvengine-$TAG/" -o "$RUNNER_TEMP/assets/cvengine-$TAG.tar.gz" "refs/tags/$TAG"
          # the bill of materials of this tag: every pinned tool, package and image (scripts/generate_sbom.py)
          python3 scripts/generate_sbom.py --output "$RUNNER_TEMP/assets/cvengine-$TAG.sbom.cdx.json"
          (cd "$RUNNER_TEMP/assets" && sha256sum cvengine-"$TAG".zip cvengine-"$TAG".tar.gz cvengine-"$TAG".sbom.cdx.json > SHA256SUMS)
          gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber
