name: 🔁 Upgrade rehearsal

# Installs the version that is released (master), puts data in it, then updates it to the version that is about to be released with the real
# update scripts, and checks the site, the workers and the data, and from 1.4 that the built-in scanner came up and enrolled with nobody running
# anything. It runs on every pull request into master (the release), and by hand for any two refs (1.4: base v1.3.5, candidate 1.4-develop or a
# branch into it). A release that would crash an existing install should fail here first.
#
#   plain   an install with docker-compose.yml only, updated with scripts/update.sh
#   overlay an install like one behind a host proxy that owns port 443 (an overlay compose file and settings in .env), updated through the
#           in-app path (scripts/apply-update.sh), then through make redis-auth

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      base:
        description: 'The installed version (a branch, tag or commit)'
        default: master
      candidate:
        description: 'The version it is updated to'
        default: develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_REF: ${{ inputs.base || github.event.pull_request.base.sha }}
  CANDIDATE_REF: ${{ inputs.candidate || github.event.pull_request.head.sha }}

jobs:
  plain:
    name: 🔁 Update a running install (docker-compose.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release candidate (the installed version plus what is being released)
        run: "$GITHUB_WORKSPACE/.github/rehearsal/prepare.sh"
      - name: Install the released version
        run: "$GITHUB_WORKSPACE/.github/rehearsal/install-base.sh plain"
      - name: Put data in it
        run: "$GITHUB_WORKSPACE/.github/rehearsal/seed.sh"
      - name: Update with scripts/update.sh
        run: |
          cd "$HOME/cvengine"
          git --git-dir="$HOME/origin.git" update-ref refs/heads/master "$(cat "$HOME/candidate.sha")"
          scripts/update.sh
      - name: The updated install works and keeps its data
        run: "$GITHUB_WORKSPACE/.github/rehearsal/verify.sh plain"
      - name: Logs
        if: failure()
        run: "$GITHUB_WORKSPACE/.github/rehearsal/logs.sh"

  overlay:
    name: 🔁 Update an install behind a host proxy (overlay, env file, port 443 taken)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release candidate (the installed version plus what is being released)
        run: "$GITHUB_WORKSPACE/.github/rehearsal/prepare.sh"
      - name: A host service owns port 443
        run: |
          sudo nohup python3 -m http.server 443 --bind 0.0.0.0 --directory /tmp >/dev/null 2>&1 &
          disown
          sleep 3
          sudo ss -ltn 'sport = :443' | grep -q LISTEN
      - name: Install the released version with the overlay
        run: "$GITHUB_WORKSPACE/.github/rehearsal/install-base.sh overlay"
      - name: Put data in it
        run: "$GITHUB_WORKSPACE/.github/rehearsal/seed.sh"
      - name: The files the running app and updater write exist, untracked, before the update
        run: |
          # The earlier bug class (a runtime file that was tracked made `git merge --ff-only` refuse on every real server): a real server has these
          # files in its checkout when an update is approved. Create what the app creates, then require that git does not track them in the
          # installed version's checkout once they are ignored, nor in the candidate, and that the checkout is clean for the updater.
          cd "$HOME/cvengine"
          printf 'master\n' > web/.update-source
          printf '{"phase":"idle"}\n' > web/.update-phase.json
          printf '{}\n' > web/.upstream-state.json
          date +%s > web/.updater-heartbeat
          for f in web/.update-source web/.update-phase.json web/.upstream-state.json web/.updater-heartbeat; do
            [ -f "$f" ] || { echo "::error::$f does not exist before the update"; exit 1; }
            if [ -n "$(git --git-dir="$HOME/origin.git" ls-tree -r --name-only "$(cat "$HOME/candidate.sha")" -- "$f")" ]; then echo "::error::the candidate tracks $f: it would block the fast-forward on a server that has it"; exit 1; fi
          done
          git --git-dir="$HOME/origin.git" show "$(cat "$HOME/candidate.sha"):.gitignore" | grep -qx 'web/.update-source' || { echo "::error::the candidate does not ignore web/.update-source"; exit 1; }
          git rev-parse HEAD > "$HOME/installed.sha"
      - name: Start requesting the site every second (visitor and API client)
        run: |
          nohup "$GITHUB_WORKSPACE/.github/rehearsal/probe.sh" >"$HOME/probe.out" 2>&1 &
          sleep 3
          test -s "$HOME/probe.log"
      - name: Approve; the host watcher applies it (the in-app path, started the way cron starts it)
        run: |
          cd "$HOME/cvengine"
          git --git-dir="$HOME/origin.git" update-ref refs/heads/master "$(cat "$HOME/candidate.sha")"
          cp "$HOME/candidate.sha" web/.update-approved
          printf 'master\n' > web/.update-branch
          # cron starts scripts/update-watch.sh with a bare environment; so does this (no PATH beyond the system's, no login shell)
          nohup env -i PATH=/usr/bin:/bin HOME="$HOME" scripts/update-watch.sh 5400 >"$HOME/watcher.log" 2>&1 &
          watcher=$!
          for _ in $(seq 1 540); do
            [ -e web/.update-approved ] || break
            kill -0 "$watcher" 2>/dev/null || break
            sleep 10
          done
          kill "$watcher" 2>/dev/null || true
          if [ -e web/.update-approved ]; then
            echo "::error::The approval is still waiting after 90 minutes: the watcher did not apply the update"
            cat "$HOME/watcher.log" || true
            exit 1
          fi
      - name: During the update a visitor saw the maintenance page and never the old image on the new files
        run: |
          sleep 5
          touch "$HOME/probe.stop"; sleep 2
          cat "$HOME/probe.log" | awk '{print $2, $3, $4, $6}' | uniq -c | head -60
          # this update starts in the host's older apply-update.sh (the installed version's): the page goes up right after its merge, so a grace of 4 samples
          "$GITHUB_WORKSPACE/.github/rehearsal/probe-check.sh" "$(cat "$HOME/installed.sha")" 4
          cd "$HOME/cvengine"
          for f in web/.update-source web/.update-phase.json; do [ -e "$f" ] || { echo "::error::$f was removed by the update"; exit 1; }; done
          [ ! -e config/nginx/state/maintenance ] || { echo "::error::the maintenance flag is still set after a verified update"; exit 1; }
          [ ! -e config/nginx/state/maintenance-failed ] || { echo "::error::the failure flag is still set after a verified update"; exit 1; }
      - name: The updated install works, keeps its data and still uses the overlay
        run: "$GITHUB_WORKSPACE/.github/rehearsal/verify.sh overlay"
      - name: Turn on Redis authentication (make redis-auth) and check again
        run: |
          cd "$HOME/cvengine"
          make redis-auth
          "$GITHUB_WORKSPACE/.github/rehearsal/verify.sh" overlay
      - name: A second update, applied by the scripts the first one installed
        run: |
          cd "$HOME/cvengine"
          second="$HOME/second"
          rm -rf "$second"
          git clone -q "$HOME/origin.git" "$second"
          git -C "$second" config user.name rehearsal
          git -C "$second" config user.email rehearsal@example.invalid
          echo "rehearsal: the second update" > "$second/docs/.rehearsal-second-update"
          git -C "$second" add -A
          git -C "$second" commit -q -m "A change that only the second update brings"
          git -C "$second" push -q origin HEAD:master
          git -C "$second" rev-parse HEAD > "$HOME/candidate.sha"
          cp "$HOME/candidate.sha" web/.update-approved
          printf 'master\n' > web/.update-branch
          # The conductor starts scans of the seeded (unreachable) targets as soon as the first update restarts the stack, and such a scan can
          # take far longer than this rehearsal waits. What is being rehearsed is how the second update is applied, not how long a scan takes:
          # stop what runs now, the way an operator's "Stop all scans" does, then let the update wait for whatever is left.
          . "$GITHUB_WORKSPACE/.github/rehearsal/lib.sh"
          dc exec -T web python3 manage.py shell -c "from cveFeed.scan_control import abort_running_scans; print(abort_running_scans(None), 'scans stopped')"
          # the scripts this update is applied by are the ones the first update installed: the page must be up BEFORE the files change
          git rev-parse HEAD > "$HOME/installed.sha"
          nohup "$GITHUB_WORKSPACE/.github/rehearsal/probe.sh" >"$HOME/probe.out" 2>&1 &
          sleep 3
          # exit 3 is "waiting: scans are running, approval kept": the host watcher calls it again a minute later, so this does too
          for attempt in $(seq 1 60); do
            status=0
            scripts/apply-update.sh || status=$?
            [ "$status" = 3 ] || break
            sleep 30
          done
          if [ "$status" != 0 ]; then
            echo "::group::what the update was waiting for"
            dc exec -T web python3 manage.py shell -c "from startScan.models import ScanHistory; [print(s.id, s.scan_status, s.start_scan_date, s.domain) for s in ScanHistory._base_manager.filter(scan_status=1)]" || true
            echo "::endgroup::"
            echo "::error::the second update ended with status $status"; exit 1
          fi
          [ ! -e web/.update-approved ] || { echo "::error::the second update did not clear its approval"; exit 1; }
          sleep 5
          touch "$HOME/probe.stop"; sleep 2
          awk '{print $2, $3, $4, $6}' "$HOME/probe.log" | uniq -c | head -60
          "$GITHUB_WORKSPACE/.github/rehearsal/probe-check.sh" "$(cat "$HOME/installed.sha")" 0
          [ ! -e config/nginx/state/maintenance ] || { echo "::error::the maintenance flag is still set after a verified update"; exit 1; }
          "$GITHUB_WORKSPACE/.github/rehearsal/verify.sh" overlay
      - name: Approving the same commit again does nothing
        run: |
          cd "$HOME/cvengine"
          before=$(docker images -q --no-trunc | sort | md5sum)
          cp "$HOME/candidate.sha" web/.update-approved
          printf 'master\n' > web/.update-branch
          scripts/apply-update.sh
          grep -q 'already at' "$(python3 scripts/update-state.py directory)/update.log" || { echo "::error::the update log does not say 'already at'"; exit 1; }
          [ "$before" = "$(docker images -q --no-trunc | sort | md5sum)" ] || { echo "::error::an update that was already applied built an image"; exit 1; }
      - name: Logs
        if: failure()
        run: "$GITHUB_WORKSPACE/.github/rehearsal/logs.sh"
