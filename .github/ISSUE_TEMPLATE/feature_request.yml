name: Feature request
description: Suggest a change or an addition to cvENGINE.
title: "feat: "
labels:
  - feature_request
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the open and closed issues
          required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Say what you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
    validations:
      required: false
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
    validations:
      required: false
