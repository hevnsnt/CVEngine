name: Bug report
description: Report something in cvENGINE that does not work as it should.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Issues are public. Use GitHub's private vulnerability reporting on hevnsnt/CVEngine instead (Security tab, "Report a vulnerability").
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the open and closed issues
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem in a few plain sentences.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: List the steps that lead to the problem.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See the error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cvENGINE version
      description: You can find it on the About page.
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: Install details
      description: Fill in each line.
      value: |
        Host OS:
        Docker Engine version:
        Docker Compose version:
        Browser:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant log output. Remove secrets and host names you do not want public.
      render: shell
    validations:
      required: false
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
    validations:
      required: false
